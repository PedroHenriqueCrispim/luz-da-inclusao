# Gera o site do Projeto Luz da Inclusão a partir da planilha (via Apps Script).
# Roda sozinho todo dia às 6h (horário de Brasília) e também pelo botão "Run workflow".
# Segurança: não usa ações de terceiros nem senhas pessoais; só o token temporário do próprio GitHub,
# com permissão apenas para gravar neste repositório e pedir a publicação do GitHub Pages.
# O computador fica fixo no Ubuntu 24.04, para atualizações do GitHub não mudarem nada sem a gente saber.
# Páginas feitas à mão (pasta "extras", ex.: extras/compaixao) são copiadas para dentro do site a cada geração.
name: Gerar site

on:
  workflow_dispatch:
  schedule:
    - cron: '0 9 * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: gerar-site
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PORTAL_API: https://script.google.com/macros/s/AKfycbwONG8yYX2Q9LOJ3ffeqS2h3gIYKaGj71aYM9fMziDqCK9rIM5Pj5aTImEZwTZD_J_y/exec?api=site
      BASE_PATH: /
      SAIDA: docs
      DOMINIO: projetoluzdainclusao.com.br
      CHROME: google-chrome
      RECURSOS_VIVOS: sim
      SITE_ORIGEM: https://projetoluzdainclusao.com.br
      INDEXAR: sim
      # Luz Kids: o Apps Script do Kids devolve a página pronta (só o conteúdo público) para virar o site /kids/.
      KIDS_API: https://script.google.com/macros/s/AKfycbxthzePqYDh3kR_3ixhU4dgfPxcEKLFLH4gAlhWnmxSC4KokIkN-ZrLu4al_SpUBCtW/exec?api=site
    steps:
      - name: Baixar o repositório
        env:
          TOKEN: ${{ github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"

      - name: Gerar as páginas
        working-directory: repo
        run: |
          node --version
          google-chrome --version
          node gerador/gerar.mjs
          # Páginas feitas à mão (não vêm da planilha): copiadas para dentro do site.
          if [ -d extras ]; then cp -R extras/. "$SAIDA"/; fi

      - name: Gerar o Luz Kids
        working-directory: repo
        run: |
          # Baixa a página pronta do Kids. Só troca se vier completa; se der errado, mantém a versão que já estava no ar.
          if curl -fsSL --max-time 180 "$KIDS_API" -o /tmp/kids.html \
             && [ "$(wc -c < /tmp/kids.html)" -gt 100000 ] \
             && grep -q 'window.__ESTATICO__ = true' /tmp/kids.html; then
            mkdir -p "$SAIDA/kids"
            cp /tmp/kids.html "$SAIDA/kids/index.html"
            echo "Luz Kids atualizado."
          elif git show "HEAD:$SAIDA/kids/index.html" 2>/dev/null | grep -q 'window.__ESTATICO__ = true'; then
            git show "HEAD:$SAIDA/kids/index.html" > "$SAIDA/kids/index.html"
            echo "Não deu para gerar o Luz Kids agora. A versão anterior continua no ar."
          else
            echo "Não deu para gerar o Luz Kids agora. Continua a página antiga, que abre o Apps Script."
          fi

      - name: Salvar no repositório
        working-directory: repo
        run: |
          # A pasta de teste da Etapa 2 a 5 não é mais usada.
          if [ -d site-novo ]; then git rm -r -q site-novo; fi
          git add "$SAIDA"
          if git diff --cached --quiet; then
            echo "Nenhuma mudança no site."
          else
            git commit -m "Site atualizado automaticamente"
            git push
          fi

      - name: Pedir a publicação no GitHub Pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" || echo "O GitHub Pages vai publicar na próxima atualização automática."
