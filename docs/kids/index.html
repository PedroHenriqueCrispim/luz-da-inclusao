<style>
 
:root{
  --azul:#2448B8;--noite:#0F1B4C;--amarelo:#FFC83D;--vermelho:#E04A3F;--verde:#2E9A6B;--laranja:#F28A2E;

}
html{-webkit-text-size-adjust:100%}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--creme);color:var(--tinta);font-family:var(--fx);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
img,svg{display:block;max-width:100%}
a{color:var(--azul)}
:focus-visible{outline:3px solid var(--azul);outline-offset:3px;border-radius:10px}
.escuro :focus-visible{outline-color:var(--amarelo)}
main:focus{outline:none}
.pular{position:absolute;left:1rem;top:-100px;z-index:100;background:var(--amarelo);color:var(--tinta);padding:.75rem 1rem;border-radius:12px;font-weight:700}
.pular:focus{top:1rem}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ct{width:100%;max-width:var(--max);margin-inline:auto;padding-inline:var(--m)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.caixa-alta{text-transform:uppercase}

 
.topo{position:sticky;top:0;z-index:40;background:var(--noite);color:var(--creme)}
.topo__barra{display:flex;align-items:center;justify-content:space-between;gap:1rem;min-height:4.1rem}
.marca{display:flex;align-items:center;gap:.6rem;min-height:48px;text-align:left}
.marca svg{width:28px;height:auto}

obradura","cor":"#FFC83D","arte":"massinha","ordem":6},{"id":"amigos","area":"crianca","nome":"Conheça meus amigos","descricao":"Cada pessoa é de um jeito","cor":"#FAF5EA","arte":"amigos","ordem":7},{"id":"jovem","area":"crianca","nome":"Espaço Jovem","descricao":"Para quem tem de 13 a 17 anos","cor":"#0F1B4C","arte":"jovem","ordem":8},{"id":"planos","area":"crianca","nome":"Planos de leitura","descricao":"Semana, mês, ano, livros e temas","cor":"#F28A2E","arte":"biblia","ordem":9}],"conteudos":[{"id":"b01","area":"crianca","secao":"historias","titulo":"Noé e a grande arca","resumo":"Um barco enorme longe do mar, animais chegando de todo lado e uma promessa pintada no céu.","faixas":["5a6","7a9","10a12"],"formato":"historia","tema":"Confiança","duracao":"8 min","adulto":false,"arte":"arca","cor":"#2448B8","video":"","arquivo":"","texto":"","baseBiblica":"Gênesis 6 a 9","lembrar":"Deus cuida de quem confia nele, mesmo quando os outros não entendem.","versiculo":"","versiculoRef":"","perguntas":["Por que as pessoas riam de Noé?","Quem entrou na arca?","O que o arco-íris quer lembrar?","Quem cabe na sua \"arca\"?"],"paraAdulto":"Leia com a criança os capítulos 6 a 9 de Gênesis em uma Bíblia infantil. Destaque a confiança de Noé e o cuidado de Deus com todos que estavam na arca.","jogo":"","jogoRef":"","destaque":true,"ordem":1,"partes":[{"ordem":1,"titulo":"Um homem diferente","texto":"Há muito, muito tempo, as pessoas tinham se esquecido de Deus. Brigavam, mentiam e faziam mal umas às outras todos os dias.\n\nMas havia um homem que andava com Deus. O nome dele era Noé. Ele tinha esposa e três filhos: Sem, Cam e Jafé.\n\nUm dia, Deus falou com Noé:\n\n> Deus: Vai chover como nunca choveu. Construa uma arca, um barco bem grande, de madeira. Eu vou proteger você, a sua família e os animais.\n\nNoé não sabia como seria aquela chuva. Mas sabia que podia confiar em Deus.","pense":"Por que Noé confiou, mesmo sem entender tudo?","cena":"ceu; p:noe ce; nuvem 300 .8; arvore d .8"},{"ordem":2,"titulo":"O barco no meio da terra seca","texto":"Noé começou a trabalhar. Cortava árvores, serrava tábuas, martelava, passava piche por dentro e por fora para a água não entrar. Os filhos ajudavam. Foram anos de trabalho!\n\nOs vizinhos passavam e davam risada:\n\n> Vizinho: Noé, para que um barco aqui, tão longe do mar?\n> Noé: Deus pediu. E eu confio nele.\n\nNoé continuou, dia após dia, mesmo quando ninguém entendia.","pense":"Como você acha que Noé se sentia quando riam dele?","cena":"ceu; arca c .8; p:noe e alegre; p:homem d"},{"ordem":3,"titulo":"Dois a dois","texto":"Quando a arca ficou pronta, aconteceu uma coisa incrível: os animais começaram a chegar. Leões e ovelhas. Girafas e formigas. Elefantes e passarinhos. Todos em pares, dois a dois.\n\nTinha bicho grande e bicho pequeno. Bicho rápido e bicho bem devagarinho, como a tartaruga. E na arca havia lugar para todos.\n\nNoé entrou com a família. E a Bíblia conta que o próprio Deus fechou a porta.\n\nEntão começou a chover. Choveu quarenta dias e quarenta noites. A água cobriu tudo, mas dentro da arca todos estavam protegidos.","pense":"Na arca cabia bicho grande e pequeno, rápido e devagar. O que isso ensina?","cena":"tempestade; chuva; arca c .9"},{"ordem":4,"titulo":"O arco no céu","texto":"Um dia, a chuva parou. A arca ficou parada no alto de um monte. Noé soltou uma pomba pela janela, e ela voltou com uma folhinha de oliveira no bico. A terra estava secando!\n\nQuando tudo secou, a porta se abriu. Os animais saíram correndo, pulando e voando. A primeira coisa que Noé fez foi agradecer a Deus.\n\nE Deus fez uma promessa:\n\n> Deus: Nunca mais haverá um dilúvio assim. Quando vocês virem o arco-íris, lembrem da minha promessa.\n\nE um arco-íris enorme apareceu no céu, com todas as cores juntinhas.","pense":"Toda vez que você vir um arco-íris, do que pode lembrar?","cena":"ceu; arcoiris c 1.1; arca c .7; pomba d; p:noe e alegre"},{"ordem":5,"titulo":"E hoje? Lugar para todos","texto":"Noé confiou em Deus mesmo quando todo mundo ria dele. Às vezes, fazer o que é certo também parece estranho para os outros.\n\nA arca tinha lugar para bicho grande e pequeno, rápido e devagar. Na sua turma também cabe todo mundo: quem fala muito, quem fala pouco, quem anda de cadeira de rodas, quem precisa de mais tempo.\n\n> Criança: E se rirem de mim por eu ajudar alguém?\n> Adulto: Lembre de Noé. Deus vê quem escolhe fazer o bem.","pense":"Quem pode entrar na sua \"arca\" esta semana?","cena":"ceu; arcoiris c; p:menino ce; p:menina cd; cadeira d .9"}],"passos":[],"quiz":[{"ordem":1,"pergunta":"O que Deus pediu para Noé construir?","certa":"Uma arca","erradas":["Uma casa","Uma torre"],"explicacao":"","nivel":"lembra"},{"ordem":2,"pergunta":"Como os animais entraram na arca?","certa":"Dois a dois","erradas":["Um de cada vez","Todos de uma vez"],"explicacao":"","nivel":"lembra"},{"ordem":3,"pergunta":"O que apareceu no céu depois da chuva?","certa":"Um arco-íris","erradas":["Uma estrela","Um avião"],"explicacao":"","nivel":"lembra"}],"voceSabia":"A arca descrita na Bíblia tinha uns 135 metros de comprimento: mais do que um campo de futebol!","canal":"","oracao":"Deus, obrigado por cuidar de mim como cuidou de Noé. Me ajuda a confiar em ti. Amém.","atividadeRapida":"Imite os sons de três animais que entraram na arca. Depois, desenhe um arco-íris com todas as cores.","nova":false,"livrinho":"https://projetoluzdainclusao.com.br/kids/livrinho-b01.pdf"},{"id":"p01","area":"crianca","secao":"planos","titulo":"Primeira semana com Jesus","resumo":"Sete dias para conhecer a vida de Jesus, com uma pergunta por dia.","faixas":["5a6","7a9","10a12","13a17"],"formato":"jogo","tema":"Semana","duracao":"7 dias","adulto":false,"arte":"luz","cor":"#2E9A6B","video":"","arquivo":"","texto":"Lucas 2:1-20|Jesus nasce|Onde Jesus foi colocado quando nasceu?|Numa manjedoura|Num berço de ouro|Num barco\nLucas 2:41-52|Jesus no templo|Onde Maria e José encontraram Jesus?|No templo|Na praia|No mercado\nMateus 3:13-17|O batismo de Jesus|Quem batizou Jesus?|João Batista|Pedro|Moisés\nMarcos 1:16-20|Jesus chama os pescadores|O que Pedro e André faziam?|Pescavam|Plantavam trigo|Eram reis\nJoão 2:1-11|Água em vinho|Em que festa aconteceu o milagre?|Num casamento|Num aniversário|Na Páscoa\nMarcos 10:13-16|Jesus e as crianças|O que Jesus disse sobre as crianças?|Deixem vir a mim|Mandem embora|Fiquem quietas\nMateus 22:34-40|O maior mandamento|Qual é o segundo maior mandamento?|Amar o próximo como a si mesmo|Ir ao templo todo dia|Nunca trabalhar","baseBiblica":"","lembrar":"Como Jesus nasceu, cresceu, chamou amigos e ensinou a amar.","versiculo":"","versiculoRef":"","perguntas":[],"paraAdulto":"","jogo":"plano","jogoRef":"","destaque":true,"ordem":1,"partes":[],"passos":[],"quiz":[],"voceSabia":"","canal":"","oracao":"","atividadeRapida":"","nova":true,"livrinho":""},{"id":"b02","area":"crianca","secao":"historias","titulo":"Davi e o gigante","resumo":"O menor de todos encara o maior de todos, sem armadura e com muita fé.","faixas":["5a6","7a9","10a12"],"formato":"historia","tema":"Coragem","duracao":"8 min","adulto":false,"arte":"funda","cor":"#E04A3F","video":"","arquivo":"","texto":"","baseBiblica":"1 Samuel 17","lembrar":"Ninguém é pequeno demais para Deus. Cada um serve do seu jeito.","versiculo":"","versiculoRef":"","perguntas":["Por que Davi não usou a armadura?","De onde vinha a coragem dele?","Você já precisou fazer algo do seu jeito?"],"paraAdulto":"A armadura de Saul não servia para Davi. É uma boa ponte para conversar sobre como cada pessoa precisa de adaptações diferentes para participar, e isso não a torna menos capaz.","jogo":"","jogoRef":"","destaque":true,"ordem":2,"partes":[{"ordem":1,"titulo":"O gigante que gritava","texto":"O exército de Israel estava acampado de um lado do vale. Do outro lado, os filisteus. E no meio deles havia um gigante chamado Golias: quase três metros de altura, capacete de bronze e uma lança enorme.\n\nTodo dia, de manhã e de tarde, durante quarenta dias, Golias gritava:\n\n> Golias: Mandem alguém lutar comigo! Quem tem coragem?\n\nNinguém tinha. Até o rei Saul tremia de medo.","pense":"Como os soldados se sentiam ouvindo o gigante?","cena":"montanha; p:golias cd; p:discipulo e .9; p:homem ce .9"},{"ordem":2,"titulo":"O caçula que levava o lanche","texto":"Longe dali, Davi cuidava das ovelhas do pai. Ele era o caçula da família, ainda menino. Um dia, o pai pediu que ele levasse comida para os irmãos que estavam no exército.\n\nQuando chegou, Davi ouviu Golias gritar e não acreditou:\n\n> Davi: Quem é esse que desafia o exército do Deus vivo?\n> Eliabe: Volte para as suas ovelhas, menino! Você só quer ver a briga.\n\nMas Davi não ficou quieto.","pense":"Já acharam você pequeno demais para fazer alguma coisa?","cena":"montanha; p:davi ce; p:irmao cd; ovelha d .7"},{"ordem":3,"titulo":"Sem armadura","texto":"O rei Saul mandou chamar Davi.\n\n> Saul: Você é só um menino. Golias é guerreiro desde jovem.\n> Davi: Quando um leão ou um urso atacava as ovelhas, Deus me ajudava a proteger o rebanho. Ele vai me ajudar agora também.\n\nSaul deu a Davi a própria armadura. Davi tentou andar e quase não saiu do lugar. Era pesada demais!\n\n> Davi: Não consigo andar com isso.\n\nEle tirou tudo, pegou o cajado, escolheu cinco pedras lisinhas no riacho e levou a funda, a mesma que usava no campo.","pense":"Por que Davi preferiu ir do jeito dele?","cena":"palacio; p:saul cd; p:davi ce"},{"ordem":4,"titulo":"Uma pedra só","texto":"Quando Golias viu Davi, deu risada:\n\n> Golias: Você vem me enfrentar com um pedaço de pau?\n> Davi: Você vem com espada e lança. Eu venho em nome do Senhor!\n\nDavi correu, colocou uma pedra na funda, girou, girou e soltou. A pedra voou direto e acertou a testa do gigante. Golias caiu no chão, e os filisteus fugiram.\n\nO menino que ninguém levava a sério tinha feito o que os soldados mais fortes não fizeram. E Davi sabia: a vitória era de Deus.","pense":"De onde vinha a coragem de Davi?","cena":"montanha; p:davi e alegre; p:golias 190 deitado .75"},{"ordem":5,"titulo":"E hoje? Cada um do seu jeito","texto":"A armadura do rei era ótima para Saul, mas não servia para Davi. Ele venceu usando o que já sabia fazer.\n\nCom as pessoas é igual. Tem criança que aprende ouvindo, outra vendo, outra mexendo com as mãos. Tem quem precise de um fone abafador, de uma cadeira especial ou de mais tempo para responder. Isso não é \"menos\": é a armadura certa para cada um.\n\n> Davi: Eu não preciso ser igual aos outros para servir a Deus.","pense":"Qual é o seu jeito especial de fazer as coisas?","cena":"ceu; p:davi ce; ovelha cd; ovelha d .8"}],"passos":[],"quiz":[{"ordem":1,"pergunta":"Quem era o gigante?","certa":"Golias","erradas":["Saul","Jônatas"],"explicacao":"","nivel":"lembra"},{"ordem":2,"pergunta":"Por que Davi tirou a armadura?","certa":"Era pesada demais","erradas":["Estava suja","Era de outra cor"],"explicacao":"","nivel":"lembra"},{"ordem":3,"pergunta":"Quantas pedras Davi precisou usar?","certa":"Uma","erradas":["Cinco","Dez"],"explicacao":"","nivel":"lembra"}],"voceSabia":"Davi escolheu cinco pedras lisinhas no riacho, mas precisou de uma só.","canal":"","oracao":"Senhor, quando eu me sentir pequeno, me lembra que tu estás comigo. Amém.","atividadeRapida":"Conte nos dedos as cinco pedras de Davi. Depois, diga uma coisa que você faz do seu jeito.","nova":false,"livrinho":"https://projetoluzdainclusao.com.br/kids/livrinho-b02.pdf"},{"id":"p02","area":"crianca","secao":"planos","titulo":"7 dias com Davi","resumo":"Do campo de ovelhas ao palácio do rei.","faixas":["5a6","7a9","10a12","13a17"],"formato":"jogo","tema":"Semana","duracao":"7 dias","adulto":false,"arte":"funda","cor":"#E04A3F","video":"","arquivo":"","texto":"1 Samuel 16:1-13|Davi é escolhido|O que Deus olha nas pessoas?|O coração|A altura|A roupa\n1 Samuel 16:14-23|Davi toca harpa|Que instrumento Davi tocava?|Harpa|Tambor|Trombeta\n1 Samuel 17:32-50|Davi e Golias|Quantas pedras Davi pegou no riacho?|Cinco|Três|Uma\n1 Samuel 18:1-4|Davi e Jônatas|O que Jônatas deu a Davi?|O manto e as armas|Um cavalo|Uma coroa\n2 Samuel 9|Mefibosete|Onde Mefibosete passou a comer?|À mesa do rei|No campo|No templo\nSalmo 23|O Senhor é o meu pastor|Como Davi chama Deus nesse salmo?|Meu pastor|Meu juiz|Meu vizinho\nSalmo 139:13-16|Feito de modo especial|O que Davi diz sobre como Deus nos fez?|De modo especial e admirável|Por acaso|Todos iguais","baseBiblica":"","lembrar":"Como Deus escolheu um menino pastor e o ajudou a ser corajoso e leal.","versiculo":"","versiculoRef":"","perguntas":[],"paraAdulto":"","jogo":"plano","jogoRef":"","destaque":false,"ordem":2,"partes":[],"passos":[],"quiz":[],"voceSabia":"","canal":"","oracao":"","atividadeRapida":"","nova":true,"livrinho":""},{"id":"b03","area":"crianca","secao":"historias","titulo":"Jonas e o grande peixe","resumo":"Fugir de Deus? Não deu muito certo. Mas a segunda chance deu!","faixas":["5a6","7a9","10a12"],"formato":"historia","tema":"Segunda chance","duracao":"8 min","adulto":false,"arte":"peixe","cor":"#2E9A6B","video":"","arquivo":"","texto":"","baseBiblica":"Jonas 1 a 3","lembrar":"Deus dá segunda chance e ama até quem a gente acha que não merece.","versiculo":"","versiculoRef":"","perguntas":["Para onde Deus pediu que Jonas fosse?","O que Jonas fez dentro do peixe?","Você já precisou de uma segunda chance?"],"paraAdulto":"","jogo":"","jogoRef":"","destaque":false,"ordem":3,"partes":[{"ordem":1,"titulo":"Indo para o lado errado","texto":"Deus falou com Jonas:\n\n> Deus: Vá até a grande cidade de Nínive e diga ao povo que pare de fazer o mal.\n\nMas Jonas não queria ir. Ele não gostava do povo de Nínive. Então desceu até o porto e pegou um navio indo para Társis, para o lado contrário, bem longe.\n\nJonas achou que podia fugir de Deus.","pense":"Dá para fugir de Deus?","cena":"mar; barco c"},{"ordem":2,"titulo":"A tempestade","texto":"No meio do mar, veio uma tempestade enorme. As ondas balançavam o navio de um lado para o outro. Os marinheiros jogavam a carga no mar e gritavam de medo. E Jonas? Dormindo no fundo do navio!\n\n> Marinheiro: Acorde! Peça ajuda ao seu Deus!\n> Jonas: A culpa é minha. Estou fugindo de Deus. Joguem-me no mar, e a tempestade vai parar.\n\nOs marinheiros não queriam, mas não havia outro jeito.","pense":"O que você acha que Jonas sentiu ao perceber que a culpa era dele?","cena":"tempestade; barco c"},{"ordem":3,"titulo":"Três dias dentro do peixe","texto":"Assim que Jonas caiu na água, a tempestade parou. E Deus mandou um peixe enorme, que engoliu Jonas inteirinho.\n\nLá dentro estava escuro, molhado e com cheiro de peixe. Jonas ficou três dias e três noites ali. E sabe o que ele fez? Orou:\n\n> Jonas: Senhor, eu te chamei no meu aperto, e tu me ouviste.\n\nEntão Deus deu uma ordem, e o peixe colocou Jonas na praia, sãozinho.","pense":"Mesmo no lugar mais difícil, Jonas orou. Quando você costuma orar?","cena":"mar; peixe c"},{"ordem":4,"titulo":"A cidade que mudou","texto":"Deus falou com Jonas de novo: \"Vá até Nínive.\" Dessa vez, Jonas foi.\n\nEle andou pela cidade avisando que todos precisavam mudar. E o povo ouviu! Do rei até as crianças, todos se arrependeram do mal que faziam.\n\nDeus viu que eles mudaram e os perdoou. Jonas aprendeu que o amor de Deus era muito maior do que ele imaginava: Deus deu uma segunda chance para Jonas e para o povo de Nínive.","pense":"Por que Deus perdoou o povo de Nínive?","cena":"cidade; p:homem e; p:mulher ce; p:crianca c; p:rei cd alegre"},{"ordem":5,"titulo":"E hoje? Segunda chance","texto":"Todo mundo erra. Quando um colega faz algo errado, podemos ajudar ele a recomeçar, em vez de deixar ele de fora para sempre.\n\n> Criança: Mas ele me chateou ontem.\n> Adulto: Então hoje pode ser o dia da segunda chance.\n\nDeus não desistiu de Jonas nem de Nínive. A gente também pode não desistir das pessoas.","pense":"Tem alguém com quem você quer recomeçar?","cena":"ceu; p:menino ce alegre; p:menina cd alegre"}],"passos":[],"quiz":[{"ordem":1,"pergunta":"Para onde Jonas fugiu?","certa":"Para o lado contrário de Nínive","erradas":["Para Nínive","Para casa"],"explicacao":"","nivel":"lembra"},{"ordem":2,"pergunta":"Onde Jonas ficou três dias?","certa":"Dentro de um grande peixe","erradas":["Numa caverna","Num barco"],"explicacao":"","nivel":"lembra"},{"ordem":3,"pergunta":"O que Deus deu a Jonas e a Nínive?","certa":"Uma segunda chance","erradas":["Um castigo","Um presente de ouro"],"explicacao":"","nivel":"lembra"}],"voceSabia":"Nínive era uma cidade tão grande que levava três dias para atravessar a pé.","canal":"","oracao":"Deus, obrigado pelas segundas chances. Me ajuda a dar segunda chance aos outros também. Amém.","atividadeRapida":"Faça com os braços o movimento das ondas, depois fique bem paradinho como o mar calmo.","nova":false,"livrinho":"https://projetoluzdainclusao.com.br/kids/livrinho-b03.pdf"},{"id":"p03","area":"crianca","secao":"planos","titulo":"30 dias de histórias da Bíblia","resumo":"Uma história por dia, do Antigo ao Novo Testamento.","faixas":["5a6","7a9","10a12","13a17"],"formato":"jogo","tema":"Mês","duracao":"30 dias","adulto":false,"arte":"biblia","cor":"#2448B8","video":"","arquivo":"","texto":"Gênesis 1|A criação\nGênesis 6 a 9|Noé e a arca\nGênesis 12:1-9|O chamado de Abraão\nGênesis 37|José e a túnica\nGênesis 45|José perdoa os irmãos\nÊxodo 2:1-10|Moisés no cesto\nÊxodo 14|O mar se abre\nÊxodo 20:1-17|Os mandamentos\nJosué 6|Os muros de Jericó\nJuízes 6 e 7|Gideão\nRute 1 a 4|Rute e Noemi\n1 Samuel 3|Samuel ouve a Deus\n1 Samuel 17|Davi e Golias\n2 Samuel 9|Mefibosete na mesa do rei\n1 Reis 17:8-16|Elias e a viúva\nEster 4 a 8|A rainha Ester\nDaniel 6|Daniel e os leões\nJonas 1 a 3|Jonas e o grande peixe\nLucas 2:1-20|O nascimento de Jesus\nMarcos 2:1-12|Os amigos do telhado\nMarcos 4:35-41|Jesus acalma a tempestade\nJoão 6:1-14|Cinco pães e dois peixes\nLucas 10:25-37|O bom samaritano\nLucas 15:3-7|A ovelha perdida\nLucas 15:11-32|O filho que voltou\nLucas 19:1-10|Zaqueu\nJoão 11:1-44|Lázaro\nLucas 24:1-12|Ele ressuscitou\nAtos 2:1-12|Pentecostes\nAtos 9:1-19|Paulo encontra Jesus","baseBiblica":"","lembrar":"As histórias mais importantes da Bíblia, do começo ao fim.","versiculo":"","versiculoRef":"","perguntas":[],"paraAdulto":"","jogo":"plano","jogoRef":"","destaque":false,"ordem":3,"partes":[],"passos":[],"quiz":[],"voceSabia":"","canal":"","oracao":"","atividadeRapida":"","nova":true,"livrinho":""},{"id":"b04","area":"crianca","secao":"historias","titulo":"Mefibosete na mesa do rei","resumo":"O rei procurou alguém para fazer o bem e encontrou um lugar vazio na mesa.","faixas":["5a6","7a9","10a12"],"formato":"historia","tema":"Inclusão","duracao":"8 min","adulto":false,"arte":"mesa","cor":"#F28A2E","video":"","arquivo":"","texto":"","baseBiblica":"2 Samuel 9 e 4:4","lembrar":"Incluir é dar um lugar à mesa, e não um lugar no canto.","versiculo":"","versiculoRef":"","perguntas":["Por que Mefibosete ficou com medo do rei?","O que Davi deu a ele?","Quem você pode chamar para a sua mesa?"],"paraAdulto":"A deficiência de Mefibosete não mudou na história; o que mudou foi o lugar dele. Essa é a ideia central: a inclusão não depende de a pessoa \"melhorar\". Há um plano de aula completo sobre esta história na área dos adultos.","jogo":"","jogoRef":"","destaque":true,"ordem":4,"partes":[{"ordem":1,"titulo":"Dois amigos e uma promessa","texto":"Davi e Jônatas eram melhores amigos. Jônatas era filho do rei Saul, e Davi seria o próximo rei. Mesmo assim, eles se amavam como irmãos.\n\nUm dia, fizeram uma promessa:\n\n> Jônatas: Prometa que você vai cuidar da minha família para sempre.\n> Davi: Eu prometo.\n\nAnos depois, Jônatas morreu numa batalha. Davi ficou muito triste.","pense":"O que faz um amigo de verdade?","cena":"ceu; p:davi ce; p:irmao cd"},{"ordem":2,"titulo":"O menino que caiu","texto":"Jônatas tinha um filho chamado Mefibosete. Quando chegou a notícia da batalha, ele tinha cinco anos. A babá pegou o menino no colo e saiu correndo para fugir. Na pressa, ela tropeçou, e Mefibosete caiu.\n\nOs pés dele se machucaram muito, e ele passou a não conseguir andar.\n\nMefibosete cresceu longe de todos, num lugar chamado Lo-Debar. Quase ninguém lembrava dele.","pense":"Como você imagina que Mefibosete se sentia, tão longe de todos?","cena":"casa; p:mulher ce colo; p:menino cd .9"},{"ordem":3,"titulo":"O rei procura","texto":"Davi se tornou rei. Um dia, ele lembrou da promessa:\n\n> Davi: Ainda existe alguém da família de Jônatas? Quero fazer o bem a essa pessoa.\n> Ziba: Existe, sim, majestade. Um filho de Jônatas. Ele não consegue andar.\n\nDavi mandou buscar Mefibosete na mesma hora. Quando chegou, Mefibosete se curvou até o chão, com medo:\n\n> Mefibosete: Quem sou eu para o rei se importar comigo?\n> Davi: Não tenha medo. Vou cuidar de você por causa do seu pai, meu amigo.","pense":"Por que é importante procurar quem está longe?","cena":"palacio; p:rei cd; p:mefibosete ce"},{"ordem":4,"titulo":"Um lugar à mesa","texto":"Davi devolveu a Mefibosete as terras da família. E fez mais:\n\n> Davi: De hoje em diante, você vai comer sempre à minha mesa, como um dos meus filhos.\n\nE foi assim. Todos os dias, Mefibosete se sentava à mesa do rei, junto com a família real.\n\nOs pés dele continuaram do mesmo jeito. O que mudou foi o lugar dele: antes esquecido, agora à mesa do rei.","pense":"O que mudou na vida de Mefibosete?","cena":"palacio; mesa c; p:rei cd sentado; p:mefibosete ce sentado"},{"ordem":5,"titulo":"E hoje? A mesa de todos","texto":"Na escola, no recreio e na igreja, existem \"mesas\" todos os dias: a roda de conversa, o time do jogo, o grupo do trabalho. Às vezes, alguém fica sem lugar.\n\n> Criança: Quer sentar com a gente?\n\nCom uma pergunta simples, você faz o que o rei Davi fez. Deus também é assim: na mesa dele, há lugar para todos.","pense":"Quem você vai convidar para a sua mesa amanhã?","cena":"casa; mesa c; p:menino ce sentado; cadeira cd .8; p:menina d sentado"}],"passos":[],"quiz":[{"ordem":1,"pergunta":"De quem Mefibosete era filho?","certa":"De Jônatas","erradas":["De Davi","De Saul"],"explicacao":"","nivel":"lembra"},{"ordem":2,"pergunta":"Onde Mefibosete passou a comer?","certa":"À mesa do rei","erradas":["No campo","Sozinho em casa"],"explicacao":"","nivel":"lembra"},{"ordem":3,"pergunta":"O que essa história ensina?","certa":"Incluir é dar um lugar à mesa","erradas":["Cada um no seu canto","Só os fortes têm lugar"],"explicacao":"","nivel":"lembra"}],"voceSabia":"O nome Lo-Debar, onde Mefibosete morava, lembra a ideia de \"lugar sem pasto\": um lugar esquecido.","canal":"","oracao":"Senhor, obrigado porque na tua mesa há lugar para mim. Me ajuda a abrir espaço para os outros. Amém.","atividadeRapida":"Arrume a mesa de casa com um lugar a mais e pense: quem eu gostaria de convidar?","nova":false,"livrinho":"https://projetoluzdainclusao.com.br/kids/livrinho-b04.pdf"},{"id":"p04","area":"crianca","secao":"planos","titulo":"Provérbios em 31 dias","resumo":"Um capítulo de sabedoria para cada dia do mês.","faixas":["10a12","13a17"],"formato":"jogo","tema":"Mês","duracao":"31 dias","adulto":false,"arte":"luz","cor":"#F28A2E","video":"","arquivo":"","texto":"Provérbios 1|Capítulo 1\nProvérbios 2|Capítulo 2\nProvérbios 3|Capítulo 3\nProvérbios 4|Capítulo 4\nProvérbios 5|Capítulo 5\nProvérbios 6|Capítulo 6\nProvérbios 7|Capítulo 7\nProvérbios 8|Capítulo 8\nProvérbios 9|Capítulo 9\nProvérbios 10|Capítulo 10\nProvérbios 11|Capítulo 11\nProvérbios 12|Capítulo 12\nProvérbios 13|Capítulo 13\nProvérbios 14|Capítulo 14\nProvérbios 15|Capítulo 15\nProvérbios 16|Capítulo 16\nProvérbios 17|Capítulo 17\nProvérbios 18|Capítulo 18\nProvérbios 19|Capítulo 19\nProvérbios 20|Capítulo 20\nProvérbios 21|Capítulo 21\nProvérbios 22|Capítulo 22\nProvérbios 23|Capítulo 23\nProvérbios 24|Capítulo 24\nProvérbios 25|Capítulo 25\nProvérbios 26|Capítulo 26\nProvérbios 27|Capítulo 27\nProvérbios 28|Capítulo 28\nProvérbios 29|Capítulo 29\nProvérbios 30|Capítulo 30\nProvérbios 31|Capítulo 31","baseBiblica":"","lembrar":"Conselhos sábios para a vida, para pensar um pouco a cada dia.","versiculo":"","versiculoRef":"","perguntas":[],"paraAdulto":"","jogo":"plano","jogoRef":"","destaque":false,"ordem":4,"partes":[],"passos":[],"quiz":[],"voceSabia":"","canal":"","oracao":"","atividadeRapida":"","nova":true,"livrinho":""},{"id":"b05","area":"crianca","secao":"historias","titulo":"Os amigos que abriram o telhado","resumo":"Quatro amigos, uma maca e uma ideia maluca: abrir o telhado!","faixas":["5a6","7a9","10a12"],"formato":"historia","tema":"Amizade","duracao":"7 min","adulto":false,"arte":"telhado","cor":"#FFC83D","video":"","arquivo":"","texto":"","baseBiblica":"Marcos 2:1-12","lembrar":"Amigo de verdade não desiste de levar o outro junto.","versiculo":"","versiculoRef":"","perguntas":["Por que os amigos não conseguiam entrar?","O que eles fizeram?","Como você pode ajudar um amigo a participar?"],"paraAdulto":"O relato fala da cura e também do perdão. Ao contar, destaque a atitude dos amigos e o cuidado de Jesus. Vale explicar que a Bíblia não ensina que deficiência é castigo (veja João 9:1-3) e evitar a ideia de que pessoas com deficiência precisam ser \"consertadas\" para serem amadas.","jogo":"","jogoRef":"","destaque":false,"ordem":5,"partes":[{"ordem":1,"titulo":"Quatro amigos","texto":"Na cidade de Cafarnaum morava um homem que não conseguia andar. Ele passava os dias deitado numa maca.\n\nMas ele tinha quatro amigos. E, quando ouviram que Jesus estava na cidade, os quatro tiveram a mesma ideia:\n\n> Amigo 1: Vamos levar ele até Jesus!\n> Amigo 2: Cada um segura uma ponta da maca. Vamos!","pense":"O que esses amigos têm de especial?","cena":"cidade; p:discipulo e .9; p:homem ce deitado .7; p:homem d .9"},{"ordem":2,"titulo":"A casa lotada","texto":"Jesus estava numa casa, e veio tanta gente que não cabia mais ninguém. Nem na porta! Tinha gente na janela, no quintal, na rua.\n\nOs quatro amigos chegaram carregando a maca e não conseguiram passar.\n\n> Amigo 3: E agora? Não dá para entrar!\n> Amigo 4: Já sei! Pelo telhado!","pense":"Os amigos podiam ter desistido. Por que não desistiram?","cena":"cidade; telhado c .9; p:discipulo e .9; p:homem d .9"},{"ordem":3,"titulo":"Um buraco no teto","texto":"Eles subiram a escada do lado de fora da casa, com a maca e tudo. Começaram a cavar o telhado bem em cima de onde Jesus estava. Pedacinhos de barro caíam lá dentro!\n\nQuando o buraco ficou grande, amarraram cordas na maca e foram descendo o amigo, devagarinho, até chegar na frente de Jesus.\n\nTodo mundo olhou para cima, espantado. E Jesus viu a fé daqueles amigos.","pense":"O que esses amigos estavam dispostos a fazer?","cena":"ceu; telhado c; p:homem ce .7; p:discipulo cd .7"},{"ordem":4,"titulo":"Levante-se","texto":"Jesus olhou para o homem com carinho. Ele se importava com aquele homem por inteiro.\n\n> Jesus: Levante-se, pegue a sua maca e vá para casa.\n\nE o homem se levantou! Pegou a maca e saiu andando, na frente de todo mundo.\n\n> Povo: Nunca vimos nada parecido!\n\nTodos louvaram a Deus. E aqueles quatro amigos voltaram para casa sorrindo.","pense":"Quem são os amigos que levam você para perto de Deus?","cena":"casa; p:jesus ce; p:homem cd alegre"},{"ordem":5,"titulo":"E hoje? Amigos que dão um jeito","texto":"Quando um amigo não consegue participar de uma brincadeira, dá para inventar um jeito: mudar a regra, escolher outro lugar, usar outro material.\n\nAmigo de verdade pensa: \"Como todo mundo pode brincar?\"\n\n> Criança: Vamos jogar bola sentados, aí todo mundo joga!","pense":"Que brincadeira você pode adaptar para ninguém ficar de fora?","cena":"ceu; cadeira ce; p:menino c alegre; p:menina cd"}],"passos":[],"quiz":[{"ordem":1,"pergunta":"Quantos amigos levaram o homem?","certa":"Quatro","erradas":["Dois","Doze"],"explicacao":"","nivel":"lembra"},{"ordem":2,"pergunta":"Por onde eles entraram na casa?","certa":"Pelo telhado","erradas":["Pela porta","Pela janela"],"explicacao":"","nivel":"lembra"},{"ordem":3,"pergunta":"O que Jesus disse ao homem?","certa":"Levante-se e ande","erradas":["Volte amanhã","Fique deitado"],"explicacao":"","nivel":"lembra"}],"voceSabia":"As casas daquela época tinham telhado reto, feito de galhos e barro, e uma escada do lado de fora.","canal":"","oracao":"Jesus, me ajuda a ser um amigo que não desiste de ninguém. Amém.","atividadeRapida":"Com mais três pessoas, segurem juntos as pontas de um lençol e levem uma almofada até o outro lado da sala.","nova":false,"livrinho":"https://projetoluzdainclusao.com.br/kids/livrinho-b05.pdf"},{"id":"p05","area":"crianca","secao":"planos","titulo":"Histórias da Bíblia em 1 ano","resumo":"Uma história por semana, durante 52 semanas. Ótimo para os pequenos e para a família.","faixas":["5a6","7a9","10a12","13a17"],"formato":"jogo","tema":"Ano","duracao":"52 semanas","adulto":false,"arte":"estrela","cor":"#7B2D8E","video":"","arquivo":"","texto":"Gênesis 1|Semana 1: A criação\nGênesis 2 e 3|Semana 2: O jardim do Éden\nGênesis 6 a 9|Semana 3: Noé e a arca\nGênesis 12:1-9|Semana 4: O chamado de Abraão\nGênesis 21:1-7|Semana 5: Isaque nasce\nGênesis 28:10-22|Semana 6: A escada de Jacó\nGênesis 37|Semana 7: José e a túnica\nGênesis 45|Semana 8: José perdoa os irmãos\nÊxodo 2:1-10|Semana 9: Moisés no cesto\nÊxodo 3|Semana 10: A sarça que queimava\nÊxodo 14|Semana 11: O mar se abre\nÊxodo 16|Semana 12: O maná no deserto\nÊxodo 20:1-17|Semana 13: Os mandamentos\nJosué 6|Semana 14: Os muros de Jericó\nJuízes 6 e 7|Semana 15: Gideão\nRute 1 a 4|Semana 16: Rute e Noemi\n1 Samuel 3|Semana 17: Samuel ouve a Deus\n1 Samuel 16|Semana 18: Davi é escolhido\n1 Samuel 17|Semana 19: Davi e Golias\n2 Samuel 9|Semana 20: Mefibosete na mesa do rei\n1 Reis 3:5-15|Semana 21: Salomão pede sabedoria\n1 Reis 17:8-16|Semana 22: Elias e a viúva\n2 Reis 5:1-14|Semana 23: Naamã é curado\nEster 4 a 8|Semana 24: A rainha Ester\nDaniel 6|Semana 25: Daniel e os leões\nJonas 1 a 3|Semana 26: Jonas e o grande peixe\nLucas 1:26-38|Semana 27: O anjo visita Maria\nLucas 2:1-20|Semana 28: O nascimento de Jesus\nMateus 3:13-17|Semana 29: O batismo de Jesus\nMarcos 1:16-20|Semana 30: Os pescadores\nJoão 2:1-11|Semana 31: O casamento em Caná\nMarcos 2:1-12|Semana 32: Os amigos do telhado\nMateus 5:1-12|Semana 33: O sermão do monte\nMateus 6:9-13|Semana 34: O Pai Nosso\nMarcos 4:35-41|Semana 35: Jesus acalma a tempestade\nJoão 6:1-14|Semana 36: Cinco pães e dois peixes\nMateus 14:22-33|Semana 37: Jesus anda sobre as águas\nLucas 10:25-37|Semana 38: O bom samaritano\nLucas 15:3-7|Semana 39: A ovelha perdida\nLucas 15:11-32|Semana 40: O filho que voltou\nMarcos 10:13-16|Semana 41: Jesus e as crianças\nMarcos 10:46-52|Semana 42: Bartimeu\nLucas 19:1-10|Semana 43: Zaqueu\nJoão 11:1-44|Semana 44: Lázaro\nMateus 21:1-11|Semana 45: Jesus entra em Jerusalém\nJoão 13:1-17|Semana 46: Jesus lava os pés\nLucas 23:26-49|Semana 47: A cruz\nLucas 24:1-12|Semana 48: Ele ressuscitou\nAtos 1:1-11|Semana 49: Jesus sobe ao céu\nAtos 2:1-12|Semana 50: Pentecostes\nAtos 3:1-10|Semana 51: O homem na porta Formosa\nAtos 9:1-19|Semana 52: Paulo encontra Jesus","baseBiblica":"","lembrar":"Uma história por semana: o ano inteiro caminhando pela Bíblia.","versiculo":"","versiculoRef":"","perguntas":[],"paraAdulto":"","jogo":"plano","jogoRef":"","destaque":false,"ordem":5,"partes":[],"passos":[],"quiz":[],"voceSabia":"","canal":"","oracao":"","atividadeRapida":"","nova":true,"livrinho":""},{"id":"b06","area":"crianca","secao":"historias","titulo":"Bartimeu, o homem que não se calou","resumo":"Mandaram ele ficar quieto. Ele chamou ainda mais alto. E Jesus parou.","faixas":["5a6","7a9","10a12"],"formato":"historia","tema":"Ser ouvido","duracao":"7 min","adulto":false,"arte":"manto","cor":"#2448B8","video":"","arquivo":"","texto":"","baseBiblica":"Marcos 10:46-52","lembrar":"Jesus para, escuta e pergunta. Nós também podemos perguntar antes de ajudar.","versiculo":"","versiculoRef":"","perguntas":["O que as pessoas mandaram Bartimeu fazer?","O que Jesus perguntou a ele?","Por que é bom perguntar antes de ajudar?"],"paraAdulto":"Um detalhe precioso: Jesus pergunta \"O que você quer que eu faça?\" em vez de decidir por Bartimeu. É um ótimo exemplo para ensinar a perguntar antes de ajudar uma pessoa com deficiência.","jogo":"","jogoRef":"","destaque":false,"ordem":6,"partes":[{"ordem":1,"titulo":"Na beira da estrada","texto":"Na saída da cidade de Jericó, sentado na beira da estrada, estava Bartimeu. Ele era cego e pedia ajuda para quem passava, com uma capa estendida no chão.\n\nTodo dia era igual: muita gente passando e quase ninguém olhando para ele.","pense":"Como você acha que era o dia de Bartimeu?","cena":"deserto; p:bartimeu ce sentado; p:homem cd; p:mulher d"},{"ordem":2,"titulo":"Jesus está passando!","texto":"Um dia, Bartimeu ouviu um barulho diferente: muitos passos, muitas vozes. Alguém contou que era Jesus! Bartimeu respirou fundo e gritou:\n\n> Bartimeu: Jesus, Filho de Davi, tenha compaixão de mim!\n> Pessoas: Fique quieto! Não incomode!\n\nMas Bartimeu não se calou. Gritou ainda mais alto.","pense":"Por que mandaram Bartimeu ficar quieto?","cena":"deserto; p:bartimeu ce sentado; p:homem c; p:jesus d"},{"ordem":3,"titulo":"Jesus parou","texto":"No meio daquela multidão toda, Jesus parou.\n\n> Jesus: Chamem esse homem.\n\nAs mesmas pessoas que mandavam Bartimeu calar agora diziam:\n\n> Pessoas: Coragem! Levante-se, ele está chamando você!\n\nBartimeu jogou a capa para o lado, deu um pulo e foi até Jesus. Para Jesus, a voz de Bartimeu importava.","pense":"Tem alguém perto de você que muitas vezes não é ouvido?","cena":"deserto; p:jesus cd; p:bartimeu ce"},{"ordem":4,"titulo":"O que você quer?","texto":"Jesus olhou para Bartimeu e fez uma pergunta:\n\n> Jesus: O que você quer que eu faça por você?\n\nJesus não decidiu por ele. Ele perguntou.\n\n> Bartimeu: Mestre, eu quero ver.\n> Jesus: Pode ir. A sua fé curou você.\n\nNaquele mesmo instante, Bartimeu começou a enxergar. E seguiu Jesus pelo caminho.","pense":"Por que você acha que Jesus perguntou, em vez de decidir sozinho?","cena":"deserto; p:jesus cd; p:bartimeu ce alegre"},{"ordem":5,"titulo":"E hoje? Perguntar antes de ajudar","texto":"Quando você quiser ajudar alguém, também pode perguntar: \"Quer ajuda?\" e \"Como posso ajudar?\". Às vezes a pessoa vai dizer que não precisa, e tudo bem.\n\n> Criança: Quer ajuda para carregar?\n> Amigo: Obrigado, eu consigo! Mas segura a porta?\n\nPerguntar mostra respeito.","pense":"Como você perguntaria a um colega se ele quer ajuda?","cena":"ceu; p:menina ce; p:menino cd"}],"passos":[],"quiz":[{"ordem":1,"pergunta":"O que Bartimeu fez quando ouviu Jesus?","certa":"Gritou ainda mais alto","erradas":["Ficou quieto","Foi embora"],"explicacao":"","nivel":"lembra"},{"ordem":2,"pergunta":"O que Jesus perguntou a ele?","certa":"O que você quer que eu faça?","erradas":["Quem é você?","Onde você mora?"],"explicacao":"","nivel":"lembra"},{"ordem":3,"pergunta":"O que aprendemos com Jesus nessa história?","certa":"Perguntar antes de ajudar","erradas":["Ajudar sem perguntar","Não parar para ninguém"],"explicacao":"","nivel":"lembra"}],"voceSabia":"Bartimeu quer dizer \"filho de Timeu\". A Bíblia guardou o nome dele, mesmo ele sendo alguém que muitos ignoravam.","canal":"","oracao":"Jesus, obrigado porque tu me escutas. Me ensina a escutar os outros. Amém.","atividadeRapida":"De olhos fechados, escute em silêncio por 30 segundos. Quantos sons diferentes você ouviu?","nova":false,"livrinho":"https://projetoluzdainclusao.com.br/kids/livrinho-b06.pdf"},{"id":"p06","area":"crianca","secao":"planos","titulo":"Bíblia em 1 ano","resumo":"A Bíblia inteira, de Gênesis a Apocalipse, em 365 dias. Para os maiores e as famílias.","faixas":["13a17"],"formato":"jogo","tema":"Ano","duracao":"365 dias","adulto":false,"arte":"biblia","cor":"#0F1B4C","video":"","arquivo":"","texto":"Gênesis 1-3|Dia 1\nGênesis 4-7|Dia 2\nGênesis 8-10|Dia 3\nGênesis 1  348\nHebreus 2-4|Dia 349\nHebreus 5-7|Dia 350\nHebreus 8-10|Dia 351\nHebreus 11 a Tiago 1|Dia 352\nTiago 2-4|Dia 353\nTiago 5 a 1 Pedro 2|Dia 354\n1 Pedro 3-5|Dia 355\n2 Pedro 1 a 1 João 1|Dia 356\n1 João 2-4|Dia 357\n1 João 5 a 3 João 1|Dia 358\nJudas 1 a Apocalipse 2|Dia 359\nApocalipse 3-6|Dia 360\nApocalipse 7-9|Dia 361\nApocalipse 10-12|Dia 362\nApocalipse 13-15|Dia 363\nApocalipse 16-19|Dia 364\nApocalipse 20-22|Dia 365","baseBiblica":"","lembrar":"A Bíblia inteira, de Gênesis a Apocalipse, em um ano.","versiculo":"","versiculoRef":"","perguntas":[],"paraAdulto":"","jogo":"plano","jogoRef":"","destaque":false,"ordem":6,"partes":[],"passos":[],"quiz":[],"voceSabia":"","canal":"","oracao":"","atividadeRapida":"","nova":true,"livrinho":""},{"id":"b07","area":"crianca","secao":"historias","titulo":"Zaqueu sobe na árvore","resumo":"Baixinho, sem amigos e em cima de um galho. Mas Jesus chamou pelo nome.","faixas":["5a6","7a9","10a12"],"formato":"historia","tema":"Ser visto","duracao":"7 min","adulto":false,"arte":"arvore","cor":"#2E9A6B","video":"","arquivo":"","texto":"","baseBiblica":"Lucas 19:1-10","lembrar":"Jesus vê quem os outros deixam de fora.","versiculo":"","versiculoRef":"","perguntas":["Por que Zaqueu subiu na árvore?","O que Jesus disse a ele?","Como Zaqueu mudou?"],"paraAdulto":"","jogo":"","jogoRef":"","destaque":false,"ordem":7,"partes":[{"ordem":1,"titulo":"Ninguém gostava dele","texto":"Em Jericó morava Zaqueu. Ele era chefe dos cobradores de impostos e muito rico. Mas quase ninguém gostava dele, porque ele cobrava mais do que devia e ficava com o dinheiro.\n\nZaqueu tinha muito dinheiro, mas pouquíssimos amigos.","pense":"Dinheiro traz amigos de verdade?","cena":"cidade; p:zaqueu c; p:homem e; p:mulher d"},{"ordem":2,"titulo":"Pequeno na multidão","texto":"Um dia, Jesus passou pela cidade. Zaqueu queria muito ver Jesus. Só que tinha um problema: ele era baixinho, e a multidão não deixava ver nada.\n\nEntão Zaqueu correu na frente e subiu num sicômoro, uma árvore de galhos baixos e fortes. Lá de cima, esperou.","pense":"O que você faz quando quer muito alguma coisa?","cena":"cidade; arvore cd; p:zaqueu cd .8; p:homem e; p:mulher ce"},{"ordem":3,"titulo":"Desça depressa","texto":"Quando Jesus chegou perto da árvore, parou e olhou para cima:\n\n> Jesus: Zaqueu, desça depressa! Hoje eu preciso ficar na sua casa.\n\nZaqueu quase caiu do galho de tanta alegria! Mas as pessoas reclamaram:\n\n> Pessoas: Ele vai à casa de um pecador!\n\nJesus não ligou para o que diziam. Ele tinha visto Zaqueu de verdade.","pense":"Como a gente se sente quando alguém lembra do nosso nome?","cena":"cidade; arvore cd; p:jesus ce; p:zaqueu cd .8 alegre"},{"ordem":4,"titulo":"Um coração novo","texto":"Na casa de Zaqueu, alguma coisa mudou por dentro dele. Ele se levantou e disse:\n\n> Zaqueu: Senhor, vou dar metade do que eu tenho aos pobres. E, se enganei alguém, vou devolver quatro vezes mais!\n> Jesus: Hoje a salvação entrou nesta casa. Eu vim procurar e salvar quem estava perdido.\n\nZaqueu não era mais o homem que todos evitavam.","pense":"O que fez Zaqueu mudar?","cena":"casa; mesa c; p:jesus ce sentado; p:zaqueu cd sentado"},{"ordem":5,"titulo":"E hoje? Chamar pelo nome","texto":"Todo mundo olhava para Zaqueu e via só os erros dele. Jesus olhou e chamou Zaqueu pelo nome.\n\nTem colega que quase ninguém chama, que ninguém sabe do que gosta.\n\n> Criança: Oi! Qual é o seu nome? Do que você gosta de brincar?","pense":"Qual colega você vai chamar pelo nome amanhã?","cena":"ceu; p:menino ce; p:crianca cd"}],"passos":[],"quiz":[{"ordem":1,"pergunta":"Por que Zaqueu subiu na árvore?","certa":"Era baixinho e queria ver Jesus","erradas":["Queria pegar frutas","Estava brincando"],"explicacao":"","nivel":"lembra"},{"ordem":2,"pergunta":"Onde Jesus quis ficar?","certa":"Na casa de Zaqueu","erradas":["No templo","Na praça"],"explicacao":"","nivel":"lembra"},{"ordem":3,"pergunta":"O que Zaqueu decidiu fazer?","certa":"Devolver o que tinha tirado","erradas":["Ficar com tudo","Mudar de cidade"],"explicacao":"","nivel":"lembra"}],"voceSabia":"O sicômoro é uma árvore de galhos baixos e fortes, perfeita para subir.","canal":"","oracao":"Jesus, obrigado porque tu sabes o meu nome. Me ajuda a ver quem está sozinho. Amém.","atividadeRapida":"Fique na ponta dos pés como Zaqueu tentando ver Jesus. Agora diga o nome de três colegas da sua turma.","nova":false,"livrinho":"https://projetoluzdainclusao.com.br/kids/livrinho-b07.pdf"},{"id":"p07","area":"crianca","secao":"planos","titulo":"João em 21 dias","resumo":"Um capítulo por dia do livro de João.","faixas":["10a12","13a17"],"formato":"jogo","tema":"Livros","duracao":"21 dias","adulto":false,"arte":"biblia","cor":"#2E9A6B","video":"","arquivo":"","texto":"João 1|Capítulo 1\nJoão 2|Capítulo 2\nJoão 3|Capítulo 3\nJoão 4|Capítulo 4\nJoão 5|Capítulo 5\nJoão 6|Capítulo 6\nJoão 7|Capítulo 7\nJoão 8|Capítulo 8\nJoão 9|Capítulo 9\nJoão 10|Capítulo 10\nJoão 11|Capítulo 11\nJoão 12|Capítulo 12\nJoão 13|Capítulo 13\nJoão 14|Capítulo 14\nJoão 15|Capítulo 15\nJoão 16|Capítulo 16\nJoão 17|Capítulo 17\nJoão 18|Capítulo 18\nJoão 19|Capítulo 19\nJoão 20|Capítulo 20\nJoão 21|Capítulo 21","baseBiblica":"","lembrar":"Quem é Jesus, pelos olhos de João, o discípulo amado.","versiculo":"","versiculoRef":"","perguntas":[],"paraAdulto":"","jogo":"plano","jogoRef":"","destaque":false,"ordem":7,"partes":[],"passos":[],"quiz":[],"voceSabia":"","canal":"","oracao":"","atividadeRapida":"","nova":true,"livrinho":""},{"id":"b08","area":"crianca","secao":"historias","titulo":"A ovelha perdida","resumo":"Noventa e nove não bastavam. O pastor queria todas.","faixas":["2a4","5a6","7a9"],"formato":"historia","tema":"Cada um importa","duracao":"5 min","adulto":false,"arte":"ovelha","cor":"#2448B8","video":"","arquivo":"","texto":"","baseBiblica":"Lucas 15:3-7","lembrar":"Para Deus, cada um importa. Ninguém sobra.","versiculo":"","versiculoRef":"","perguntas":["Quantas ovelhas o pastor tinha?","O que ele fez quando faltou uma?","Como Deus é parecido com esse pastor?"],"paraAdulto":"","jogo":"","jogoRef":"","destaque":false,"ordem":8,"partes":[{"ordem":1,"titulo":"Cem ovelhas","texto":"Jesus contou uma história. Era uma vez um pastor que tinha cem ovelhas. Ele conhecia cada uma: a mais gordinha, a mais bagunceira, a que andava mais devagar.\n\nTodos os dias, ele levava as ovelhas para comer capim verde e beber água fresquinha.","pense":"Por que o pastor conhecia cada ovelha?","cena":"montanha; p:pastor ce; ovelha cd; ovelha d; ovelha 300 .8"},{"ordem":2,"titulo":"Faltou uma","texto":"No fim do dia, o pastor contou as ovelhas: uma, duas, três... noventa e oito, noventa e nove...\n\nNoventa e nove! Faltava uma.\n\n> Pastor: Cadê a minha ovelhinha?","pense":"Por que o pastor se preocupou, se ainda tinha noventa e nove?","cena":"montanha; p:pastor c; ovelha e; ovelha ce .8; ovelha d .9"},{"ordem":3,"titulo":"Procurando","texto":"O pastor deixou as outras noventa e nove num lugar seguro e saiu para procurar.\n\nSubiu morro, desceu morro. Olhou atrás das pedras e no meio dos espinhos. Já estava escurecendo, mas ele não desistiu.\n\nDe repente, ouviu um barulhinho:\n\n> Ovelha: Méééé...\n\nLá estava ela, sozinha e com medo.","pense":"Como a ovelha se sentiu quando viu o pastor?","cena":"noite; p:pastor ce; ovelha d .8"},{"ordem":4,"titulo":"Festa!","texto":"O pastor pegou a ovelha, colocou nos ombros e voltou para casa feliz da vida. Chegando lá, chamou os amigos:\n\n> Pastor: Venham comemorar comigo! Encontrei a minha ovelha perdida!\n\nJesus explicou: Deus é assim. Ele não desiste de ninguém. E no céu tem festa quando alguém volta para perto dele.","pense":"Por que teve festa no céu?","cena":"ceu; p:pastor c alegre; ovelha cd .7"},{"ordem":5,"titulo":"E hoje? Ninguém sobra","texto":"Quando a turma vai brincar e alguém fica sozinho, é como a ovelha que ficou para trás. Você pode ser como o pastor: perceber quem falta e ir buscar.\n\n> Criança: Ei, vem brincar com a gente!","pense":"Como você percebe quando alguém está sozinho?","cena":"ceu; ovelha ce; ovelha c; ovelha cd; p:menina d"}],"passos":[],"quiz":[{"ordem":1,"pergunta":"Quantas ovelhas o pastor tinha?","certa":"Cem","erradas":["Dez","Mil"],"explicacao":"","nivel":"lembra"},{"ordem":2,"pergunta":"O que o pastor fez quando faltou uma?","certa":"Foi procurar","erradas":["Desistiu","Comprou outra"],"explicacao":"","nivel":"lembra"},{"ordem":3,"pergunta":"O que aconteceu quando ele achou a ovelha?","certa":"Uma festa","erradas":["Uma bronca","Nada"],"explicacao":"","nivel":"lembra"}],"voceSabia":"Jesus contou essa história junto com outras duas: a da moeda perdida e a do filho perdido.","canal":"","oracao":"Deus, obrigado porque tu não desistes de ninguém, nem de mim. Amém.","atividadeRapida":"Esconda um bichinho de pelúcia pela casa e peça para alguém procurar até achar. Quando achar, comemorem!","nova":false,"livrinho":"https://projetoluzdainclusao.com.br/kids/livrinho-b08.pdf"},{"id":"p08","area":"crianca","secao":"planos","titulo":"Atos em 28 dias","resumo":"Um capítulo por dia do livro de Atos.","faixas":["10a12","13a17"],"formato":"jogo","tema":"Livros","duracao":"28 dias","adulto":false,"arte":"biblia","cor":"#E04A3F","video":"","arquivo":"","texto":"Atos 1|Capítulo 1\nAtos 2|Capítulo 2\nAtos 3|Capítulo 3\nAtos 4|Capítulo 4\nAtos 5|Capítulo 5\nAtos 6|Capítulo 6\nAtos 7|Capítulo 7\nAtos 8|Capítulo 8\nAtos 9|Capítulo 9\nAtos 10|Capítulo 10\nAtos 11|Capítulo 11\nAtos 12|Capítulo 12\nAtos 13|Capítulo 13\nAtos 14|Capítulo 14\nAtos 15|Capítulo 15\nAtos 16|Capítulo 16\nAtos 17|Capítulo 17\nAtos 18|Capítulo 18\nAtos 19|Capítulo 19\nAtos 20|Capítulo 20\nAtos 21|Capítulo 21\nAtos 22|Capítulo 22\nAtos 23|Capítulo 23\nAtos 24|Capítulo 24\nAtos 25|Capítulo 25\nAtos 26|Capítulo 26\nAtos 27|Capítulo 27\nAtos 28|Capítulo 28","baseBiblica":"","lembrar":"Como a igreja começou e o Evangelho chegou a muitos povos.","versiculo":"","versiculoRef":"","perguntas":[],"paraAdulto":"","jogo":"plano","jogoRef":"","destaque":false,"ordem":8,"partes":[],"passos":[],"quiz":[],"voceSabia":"","canal":"","oracao":"","atividadeRapida":"","nova":true,"livrinho":""},{"id":"b09","area":"crianca","secao":"historias","titulo":"O menino que repartiu o lanche","resumo":"Cinco pães, dois peixes e milhares de pessoas com fome.","faixas":["5a6","7a9","10a12"],"formato":"historia","tema":"Repartir","duracao":"7 min","adulto":false,"arte":"paes","cor":"#F28A2E","video":"","arquivo":"","texto":"","baseBiblica":"João 6:1-14","lembrar":"O pouco que a gente reparte vira muito nas mãos de Jesus.","versiculo":"","versiculoRef":"","perguntas":["O que o menino tinha no lanche?","Quantos cestos sobraram?","O que você pode repartir?"],"paraAdulto":"","jogo":"","jogoRef":"","destaque":false,"ordem":9,"partes":[{"ordem":1,"titulo":"Uma multidão no monte","texto":"Uma multidão enorme seguiu Jesus até um monte, perto do mar da Galileia. Tinham visto Jesus cuidar de muita gente e queriam ouvir o que ele ensinava.\n\nEram tantas pessoas que não dava nem para contar. O dia foi passando, e todo mundo ficou com fome.","pense":"Por que tanta gente seguia Jesus?","cena":"montanha; p:jesus ce; p:discipulo c; p:homem cd; p:mulher d"},{"ordem":2,"titulo":"Onde comprar pão?","texto":"> Jesus: Filipe, onde vamos comprar pão para toda essa gente?\n> Filipe: Nem com muito dinheiro daria para cada um comer um pedacinho!\n\nEntão André chegou com um menino:\n\n> André: Este menino tem cinco pães e dois peixinhos. Mas o que é isso para tanta gente?\n\nO menino podia ter guardado o lanche só para ele. Mas ofereceu tudo.","pense":"Por que o menino ofereceu o lanche?","cena":"montanha; p:jesus ce; p:discipulo c; p:menino cd"},{"ordem":3,"titulo":"Nas mãos de Jesus","texto":"Jesus pediu que todos se sentassem na grama. Pegou os pães, olhou para o céu e agradeceu a Deus.\n\nDepois começou a repartir. Os discípulos entregavam pão e peixe para um, para outro, para mais outro...\n\nE a comida não acabava! Todo mundo comeu quanto quis. Só de homens, havia uns cinco mil, sem contar as mulheres e as crianças.","pense":"O que aconteceu com o pouco que o menino entregou?","cena":"montanha; p:jesus c; pao ce; peixinho cd; p:homem e sentado; p:mulher d sentado"},{"ordem":4,"titulo":"Doze cestos","texto":"Quando todos ficaram satisfeitos, Jesus pediu:\n\n> Jesus: Juntem os pedaços que sobraram, para não desperdiçar nada.\n\nOs discípulos encheram doze cestos com as sobras! Tudo começou com um menino que resolveu repartir o que tinha.","pense":"Por que Jesus pediu para juntar as sobras?","cena":"montanha; cesto e; cesto ce; cesto c; cesto cd; cesto d"},{"ordem":5,"titulo":"E hoje? Repartir","texto":"Você também tem coisas para repartir: o lanche, um brinquedo, um sorriso, a sua companhia, a sua paciência para esperar alguém terminar de falar.\n\nO menino não tinha muito, mas entregou tudo nas mãos de Jesus.","pense":"O que você pode repartir esta semana?","cena":"casa; mesa c; p:menino ce sentado; p:menina cd sentado"}],"passos":[],"quiz":[{"ordem":1,"pergunta":"O que o menino tinha no lanche?","certa":"Cinco pães e dois peixes","erradas":["Uma maçã","Um bolo"],"explicacao":"","nivel":"lembra"},{"ordem":2,"pergunta":"Quantos cestos sobraram?","certa":"Doze","erradas":["Dois","Nenhum"],"explicacao":"","nivel":"lembra"},{"ordem":3,"pergunta":"O que essa história ensina?","certa":"Repartir o pouco que temos","erradas":["Guardar tudo só para nós","Comer sozinho"],"explicacao":"","nivel":"lembra"}],"voceSabia":"Esse é o único milagre de Jesus, além da ressurreição, contado nos quatro Evangelhos.","canal":"","oracao":"Jesus, eu entrego nas tuas mãos o pouco que eu tenho. Me ensina a repartir. Amém.","atividadeRapida":"Divida um lanche com alguém hoje. Conte quantas pessoas conseguiram comer um pedacinho.","nova":false,"livrinho":"https://projetoluzdainclusao.com.br/kids/livrinho-b09.pdf"},{"id":"p09","area":"crianca","secao":"planos","titulo":"Gênesis em 50 dias","resumo":"Um capítulo por dia do livro de Gênesis.","faixas":["10a12","13a17"],"formato":"jogo","tema":"Livros","duracao":"50 dias","adulto":false,"arte":"biblia","cor":"#F28A2E","video":"","arquivo":"","texto":"Gênesis 1|Capítulo 1\nGênesis 2|Capítulo 2\nGênesis 3|Capítulo 3\nGênesis 4|Capítulo 4\nGênesis 5|Capítulo 5\nGênesis 6|Capítulo 6\nGênesis 7|Capítulo 7\nGênesis 8|Capítulo 8\nGênesis 9|Capítulo 9\nGênesis 10|Capítulo 10\nGênesis 11|Capítulo 11\nGênesis 12|Capítulo 12\nGênesis 13|Capítulo 13\nGênesis 14|Capítulo 14\nGênesis 15|Capítulo 15\nGênesis 16|Capítulo 16\nGênesis 17|Capítulo 17\nGênesis 18|Capítulo 18\nGênesis 19|Capítulo 19\nGênesis 20|Capítulo 20\nGênesis 21|Capítulo 21\nGênesis 22|Capítulo 22\nGênesis 23|Capítulo 23\nGênesis 24|Capítulo 24\nGênesis 25|Capítulo 25\nGênesis 26|Capítulo 26\nGênesis 27|Capítulo 27\nGênesis 28|Capítulo 28\nGênesis 29|Capítulo 29\nGênesis 30|Capítulo 30\nGênesis 31|Capítulo 31\nGênesis 32|Capítulo 32\nGênesis 33|Capítulo 33\nGênesis 34|Capítulo 34\nGênesis 35|Capítulo 35\nGênesis 36|Capítulo 36\nGênesis 37|Capítulo 37\nGênesis 38|Capítulo 38\nGênesis 39|Capítulo 39\nGênesis 40|Capítulo 40\nGênesis 41|Capítulo 41\nGênesis 42|Capítulo 42\nGênesis 43|Capítulo 43\nGênesis 44|Capítulo 44\nGênesis 45|Capítulo 45\nGênesis 46|Capítulo 46\nGênesis 47|Capítulo 47\nGênesis 48|Capítulo 48\nGênesis 49|Capítulo 49\nGênesis 50|Capítulo 50","baseBiblica":"","lembrar":"O começo de tudo: a criação, Noé, Abraão, Jacó e José.","versiculo":"","versiculoRef":"","perguntas":[],"paraAdulto":"","jogo":"plano","jogoRef":"","destaque":false,"ordem":9,"partes":[],"passos":[],"quiz":[],"voceSabia":"","canal":"","oracao":"","atividadeRapida":"","nova":true,"livrinho":""},{"id":"b10","area":"crianca","secao":"historias","titulo":"O bom samaritano","resumo":"Dois passaram reto. Um parou. Quem é o meu próximo?","faixas":["7a9","10a12","13a17"],"formato":"historia","tema":"Amar o próximo","duracao":"8 min","adulto":false,"arte":"estrada","cor":"#E04A3F","video":"","arquivo":"","texto":"","baseBiblica":"Lucas 10:25-37","lembrar":"Meu próximo é quem precisa de mim, mesmo que seja diferente de mim.","versiculo":"Ame o seu próximo como a si mesmo.","versiculoRef":"Mateus 22:39","perguntas":["Quem passou reto pelo homem ferido?","O que o samaritano fez?","Quem é o seu próximo?"],"paraAdulto":"","jogo":"","jogoRef":"","destaque":false,"ordem":10,"partes":[{"ordem":1,"titulo":"Uma pergunta para Jesus","texto":"Um professor da lei perguntou a Jesus:\n\n> Professor: O que eu preciso fazer para ter a vida eterna?\n> Jesus: O que diz a lei?\n> Professor: Amar a Deus de todo o coração e amar o próximo como a si mesmo.\n> Jesus: Isso mesmo. Faça isso e viverá.\n> Professor: E quem é o meu próximo?\n\nEntão Jesus contou uma história.","pense":"Quem você acha que é o \"próximo\"?","cena":"cidade; p:jesus ce; p:sacerdote cd"},{"ordem":2,"titulo":"Na estrada perigosa","texto":"Um homem descia de Jerusalém para Jericó, por uma estrada cheia de pedras e curvas. De repente, ladrões o atacaram, levaram tudo o que ele tinha e o deixaram machucado na beira da estrada.\n\nEle não conseguia levantar. Só podia esperar que alguém passasse.","pense":"Como esse homem devia estar se sentindo?","cena":"deserto; p:homem cd deitado"},{"ordem":3,"titulo":"Passando reto","texto":"Logo passou por ali um sacerdote, um homem que trabalhava no templo. Ele viu o homem ferido... e passou pelo outro lado da estrada.\n\nDepois passou um levita, que também servia no templo. Ele olhou... e também passou reto.\n\nO homem continuava ali, sozinho.","pense":"Por que será que eles não pararam?","cena":"deserto; p:sacerdote ce; p:homem cd deitado"},{"ordem":4,"titulo":"O que parou","texto":"Então passou um samaritano. Os samaritanos e os judeus não se davam bem; eram povos que se evitavam.\n\nMas, quando viu o homem ferido, o samaritano sentiu compaixão. Parou, cuidou das feridas, colocou o homem no próprio animal e o levou até uma hospedaria. Ainda pagou para cuidarem dele.\n\n> Jesus: Qual dos três foi o próximo do homem ferido?\n> Professor: Aquele que teve compaixão dele.\n> Jesus: Então vá e faça o mesmo.","pense":"O que o samaritano fez de diferente?","cena":"deserto; p:samaritano ce; p:homem cd deitado"},{"ordem":5,"titulo":"E hoje? Parar e cuidar","texto":"Hoje, \"passar reto\" pode ser fingir que não viu o colega sozinho, rir junto de uma piada maldosa ou não esperar quem anda mais devagar.\n\nParar é escolher cuidar, mesmo de quem é diferente de você.","pense":"Em que situação você pode parar em vez de passar reto?","cena":"ceu; p:menino ce; cadeira c; p:menina cd"}],"passos":[],"quiz":[{"ordem":1,"pergunta":"Quem parou para ajudar o homem ferido?","certa":"O samaritano","erradas":["O sacerdote","O levita"],"explicacao":"","nivel":"lembra"},{"ordem":2,"pergunta":"O que o samaritano fez?","certa":"Cuidou dele e pagou a hospedaria","erradas":["Passou reto","Chamou os ladrões"],"explicacao":"","nivel":"lembra"},{"ordem":3,"pergunta":"Quem é o meu próximo?","certa":"Quem precisa de mim","erradas":["Só meus amigos","Só minha família"],"explicacao":"","nivel":"lembra"}],"voceSabia":"O caminho de Jerusalém a Jericó descia uns mil metros em poucos quilômetros e era conhecido por ser perigoso.","canal":"","oracao":"Senhor, me ajuda a parar quando alguém precisa de mim. Amém.","atividadeRapida":"Faça um \"kit de cuidado\" de brincadeira com um curativo, uma garrafinha de água e um bilhete carinhoso.","nova":false,"livrinho":"https://projetoluzdainclusao.com.br/kids/livrinho-b10.pdf"},{"id":"p10","area":"crianca","secao":"planos","titulo":"Coragem","resumo":"7 dias de leitura sobre coragem.","faixas":["5a6","7a9","10a12","13a17"],"formato":"jogo","tema":"Temas","duracao":"7 dias","adulto":false,"arte":"leao","cor":"#E04A3F","video":"","arquivo":"","texto":"Josué 1:1-9|Seja forte e corajoso|O que Deus disse a Josué?|Seja forte e corajoso|Volte para casa|Fique escondido\n1 Samuel 17:32-50|Davi enfrenta o gigante|Com o que Davi enfrentou Golias?|Funda e pedra|Espada|Arco e flecha\nDaniel 6:10-23|Daniel não deixa de orar|O que Daniel fazia três vezes por dia?|Orava|Comia|Dormia\nEster 4:12-17|Ester decide falar|O que Ester pediu ao povo antes de ir ao rei?|Que jejuassem por ela|Uma coroa nova|Um cavalo\nMarcos 4:35-41|O medo no barco|Onde Jesus estava quando veio a tempestade?|Dormindo no barco|Na praia|No templo\nJuízes 6:11-16|Gideão, o guerreiro valente|Como o anjo chamou Gideão?|Guerreiro valente|Menino pequeno|Rei\nAtos 4:13-20|Pedro e João falam com coragem|O que eles não podiam deixar de fazer?|Falar do que viram e ouviram|Pescar|Cantar","baseBiblica":"","lembrar":"Pessoas que tiveram coragem porque confiaram em Deus.","versiculo":"","versiculoRef":"","perguntas":[],"paraAdulto":"","jogo":"plano","jogoRef":"","destaque":false,"ordem":10,"partes":[],"passos":[],"quiz":[],"voceSabia":"","canal":"","oracao":"","atividadeRapida":"","nova":true,"livrinho":""},{"id":"b11","area":"crianca","secao":"historias","titulo":"Jesus recebe as crianças","resumo":"Os discípulos disseram não. Jesus disse: deixem vir!","faixas":["2a4","5a6"],"formato":"historia","tema":"Todos são bem-vindos","duracao":"4 min","adulto":false,"arte":"criancas","cor":"#FFC83D","video":"","arquivo":"","texto":"","baseBiblica":"Marcos 10:13-16","lembrar":"Jesus ama todas as crianças, de todos os jeitos.","versiculo":"","versiculoRef":"","perguntas":["O que Jesus fez com as crianças?","Jesus ama você?"],"paraAdulto":"","jogo":"","jogoRef":"","destaque":false,"ordem":11,"partes":[{"ordem":1,"titulo":"As famílias chegam","texto":"Muitas famílias levaram as crianças para perto de Jesus. Tinha bebê de colo, criança pequena e criança maior. Todas queriam ver Jesus.","pense":"Quem foi ver Jesus?","cena":"ceu; p:mulher e colo; p:menino ce; p:menina c; p:homem cd"},{"ordem":2,"titulo":"Não pode!","texto":"Os discípulos disseram:\n\n> Discípulos: Jesus está ocupado! Levem as crianças embora!\n\nAs crianças ficaram tristes.","pense":"Como as crianças se sentiram?","cena":"ceu; p:discipulo cd; p:menino ce; p:menina c"},{"ordem":3,"titulo":"Deixem vir!","texto":"Mas Jesus disse:\n\n> Jesus: Deixem as crianças virem até mim! Não as impeçam!\n\nAs crianças correram até Jesus, felizes da vida.","pense":"O que Jesus disse?","cena":"ceu; p:jesus cd alegre; p:menino ce alegre; p:menina c alegre"},{"ordem":4,"titulo":"No colo de Jesus","texto":"Jesus pegou as crianças no colo e abençoou cada uma. As que falam muito e as que falam pouco. As que correm e as que usam cadeira de rodas. Todas!","pense":"Quem Jesus abençoou?","cena":"ceu; p:jesus c sentado; p:menino ce; p:menina cd; cadeira d .8"},{"ordem":5,"titulo":"E hoje? Jesus ama você","texto":"Jesus ama todas as crianças. E ama você também, do jeitinho que você é!","pense":"Diga bem alto: Jesus me ama!","cena":"ceu; p:jesus c sentado; p:crianca ce; p:menina cd"}],"passos":[],"quiz":[{"ordem":1,"pergunta":"O que os discípulos queriam fazer com as crianças?","certa":"Mandar embora","erradas":["Dar um presente","Contar uma história"],"explicacao":"","nivel":"lembra"},{"ordem":2,"pergunta":"O que Jesus disse?","certa":"Deixem as crianças virem!","erradas":["Fiquem longe","Voltem depois"],"explicacao":"","nivel":"lembra"}],"voceSabia":"Na época de Jesus, muita gente achava que crianças não eram importantes. Jesus mostrou o contrário.","canal":"","oracao":"Jesus, obrigado porque tu me amas do jeitinho que eu sou. Amém.","atividadeRapida":"Dê um abraço em alguém (se a pessoa quiser) e diga: Jesus ama você!","nova":false,"livrinho":"https://projetoluzdainclusao.com.br/kids/livrinho-b11.pdf"},{"id":"p11","area":"crianca","secao":"planos","titulo":"Amizade","resumo":"7 dias de leitura sobre amizade.","faixas":["5a6","7a9","10a12","13a17"],"formato":"jogo","tema":"Temas","duracao":"7 dias","adulto":false,"arte":"amigos","cor":"#2E9A6B","video":"","arquivo":"","texto":"1 Samuel 18:1-4|Davi e Jônatas|O que Davi e Jônatas fizeram?|Uma aliança de amizade|Uma briga|Uma corrida\nRute 1:16-18|Rute e Noemi|O que Rute disse a Noemi?|Aonde você for, eu irei|Vou embora|Fique sozinha\nMarcos 2:1-12|Os amigos do telhado|Por onde os amigos desceram a maca?|Pelo telhado|Pela janela|Pela porta\nProvérbios 17:17|Amigo em todos os momentos|Quando o amigo ama?|Em todos os momentos|Só nos dias felizes|Nunca\nJoão 15:12-15|Jesus nos chama de amigos|Como Jesus chamou os discípulos?|Amigos|Desconhecidos|Vizinhos\nEclesiastes 4:9-12|Melhor dois do que um|O que é melhor, segundo esse texto?|Dois do que um|Ficar sozinho|Ter muitos brinquedos\nLucas 10:38-42|Marta e Maria|Quem sentou aos pés de Jesus para ouvir?|Maria|Marta|Pedro","baseBiblica":"","lembrar":"Como ser um amigo de verdade, do jeito que a Bíblia ensina.","versiculo":"","versiculoRef":"","perguntas":[],"paraAdulto":"","jogo":"plano","jogoRef":"","destaque":false,"ordem":11,"partes":[],"passos":[],"quiz":[],"voceSabia":"","canal":"","oracao":"","atividadeRapida":"","nova":true,"livrinho":""},{"id":"b12","area":"crianca","secao":"historias","titulo":"José e a túnica colorida","resumo":"Inveja, um poço, uma prisão, um palácio e um perdão enorme.","faixas":["5a6","7a9","10a12","13a17"],"formato":"historia","tema":"Perdão","duracao":"9 min","adulto":false,"arte":"tunica","cor":"#E04A3F","video":"","arquivo":"","texto":"","baseBiblica":"Gênesis 37 a 45","lembrar":"Deus pode transformar o mal em bem. E perdoar é mais forte do que se vingar.","versiculo":"","versiculoRef":"","perguntas":["Por que os irmãos tinham inveja de José?","Como José ajudou o Egito?","O que José fez quando reencontrou os irmãos?"],"paraAdulto":"A história é longa na Bíblia. Se quiser, leia com a criança os capítulos 37, 41 e 45 de Gênesis, que resumem o começo, a virada e o reencontro.","jogo":"","jogoRef":"","destaque":false,"ordem":12,"partes":[{"ordem":1,"titulo":"O presente que causou ciúmes","texto":"Jacó tinha doze filhos. José era um dos mais novos, e Jacó deu a ele uma túnica muito bonita, cheia de cores.\n\nOs irmãos ficaram com ciúmes. E pioraram quando José contou os sonhos que tinha: neles, os irmãos se curvavam diante dele.\n\n> Irmão: Você acha que vai mandar na gente?","pense":"Por que os irmãos ficaram com ciúmes?","cena":"campo; p:jose ce; tunica cd .9; p:irmao d"},{"ordem":2,"titulo":"No fundo do poço","texto":"Um dia, longe de casa, os irmãos viram José chegando com a túnica colorida. Pegaram José, tiraram a túnica dele e o jogaram num poço vazio. Depois, venderam José para comerciantes que iam para o Egito.\n\nJosé foi levado para longe, sozinho, para um país que ele não conhecia.","pense":"Como José se sentiu sendo traído pelos irmãos?","cena":"deserto; poco c; p:irmao e; p:irmao d"},{"ordem":3,"titulo":"Da prisão ao palácio","texto":"No Egito, José trabalhou como servo e depois foi parar na prisão, mesmo sem ter feito nada de errado. Mas Deus estava com ele em todo lugar.\n\nUm dia, o faraó teve sonhos estranhos que ninguém conseguia explicar. José foi chamado:\n\n> José: Não sou eu quem explica os sonhos. É Deus quem dá a resposta.\n\nOs sonhos avisavam: sete anos de muita comida e depois sete anos de fome. O faraó colocou José para cuidar de todo o Egito.","pense":"Como Deus estava com José na prisão?","cena":"palacio; p:farao cd; p:jose ce"},{"ordem":4,"titulo":"O reencontro","texto":"A fome chegou, e os irmãos de José foram ao Egito comprar comida. Eles não reconheceram José, mas José reconheceu os irmãos.\n\nJosé poderia se vingar. Em vez disso, chorou e contou quem era:\n\n> José: Eu sou José, o irmão de vocês! Vocês planejaram o mal, mas Deus transformou tudo em bem para salvar muitas vidas.\n\nJosé abraçou os irmãos e trouxe toda a família para morar perto dele.","pense":"Por que José escolheu perdoar?","cena":"palacio; p:jose ce alegre; p:irmao cd; p:irmao d"},{"ordem":5,"titulo":"E hoje? Perdoar e recomeçar","texto":"Perdoar não quer dizer que o que aconteceu foi certo. Quer dizer que você escolhe não guardar raiva no coração. Às vezes precisamos da ajuda de um adulto para conseguir.\n\n> Criança: Ainda estou chateado...\n> Adulto: Tudo bem. Perdoar pode levar um tempo. Vamos pedir ajuda a Deus juntos?","pense":"Tem alguém que você precisa perdoar?","cena":"ceu; p:menino ce; p:menina cd alegre"}],"passos":[],"quiz":[{"ordem":1,"pergunta":"O que José ganhou do pai?","certa":"Uma túnica colorida","erradas":["Um cavalo","Uma coroa"],"explicacao":"","nivel":"lembra"},{"ordem":2,"pergunta":"O que os irmãos fizeram com José?","certa":"Venderam ele","erradas":["Deram um abraço","Fizeram uma festa"],"explicacao":"","nivel":"lembra"},{"ordem":3,"pergunta":"O que José fez quando reencontrou os irmãos?","certa":"Perdoou","erradas":["Se vingou","Fugiu"],"explicacao":"","nivel":"lembra"}],"voceSabia":"José tinha 17 anos quando foi vendido e uns 30 quando passou a governar o Egito.","canal":"","oracao":"Deus, quando alguém me magoar, me ajuda a perdoar como José perdoou. Amém.","atividadeRapida":"Pinte uma túnica de muitas cores num papel. Em cada cor, escreva algo bom que Deus fez por você.","nova":false,"livrinho":"https://projetoluzdainclusao.com.br/kids/livrinho-b12.pdf"},{"id":"p12","area":"crianca","secao":"planos","titulo":"Perdão","resumo":"7 dias de leitura sobre perdão.","faixas":["5a6","7a9","10a12","13a17"],"formato":"jogo","tema":"Temas","duracao":"7 dias","adulto":false,"arte":"tunica","cor":"#F28A2E","video":"","arquivo":"","texto":"Gênesis 45:1-15|José perdoa os irmãos\nMateus 18:21-22|Perdoar quantas vezes?\nLucas 15:11-24|O pai que perdoa\nLucas 23:33-34|Jesus perdoa na cruz\nEfésios 4:32|Bondosos uns com os outros\nLucas 19:1-10|Zaqueu recomeça\nSalmo 103:8-12|O amor de Deus","baseBiblica":"","lembrar":"Por que perdoar é tão importante e como Deus nos perdoa.","versiculo":"","versiculoRef":"","perguntas":[],"paraAdulto":"","jogo":"plano","jogoRef":"","destaque":false,"ordem":12,"partes":[],"passos":[],"quiz":[],"voceSabia":"","canal":"","oracao":"","atividadeRapida":"","nova":true,"livrinho":""},{"id":"b13","area":"crianca","secao":"historias","titulo":"Rute, a amiga que ficou","resumo":"Uma estrangeira, uma sogra sozinha e uma lealdade que mudou a história.","faixas":["7a9","10a12","13a17"],"formato":"historia","tema":"Lealdade","duracao":"8 min","adulto":false,"arte":"trigo","cor":"#F28A2E","video":"","arquivo":"","texto":"","baseBiblica":"Rute 1 a 4","lembrar":"Ficar ao lado de quem está sozinho é uma forma linda de amar.","versiculo":"","versiculoRef":"","perguntas":["O que Rute prometeu a Noemi?","Como Boaz ajudou Rute?","Quem você pode acompanhar quando estiver sozinho?"],"paraAdulto":"","jogo":"","jogoRef":"","destaque":false,"ordem":13,"partes":[{"ordem":1,"titulo":"Tristeza em Moabe","texto":"Noemi morava em Moabe, um país estrangeiro, com o marido e os dois filhos. Os filhos se casaram com duas moças de lá: Orfa e Rute.\n\nMas aconteceu uma coisa muito triste: o marido e os dois filhos de Noemi morreram. Ela ficou sozinha, longe da sua terra.","pense":"Como Noemi devia estar se sentindo?","cena":"deserto; p:noemi ce; p:rute c; p:mulher cd"},{"ordem":2,"titulo":"Eu vou com você","texto":"Noemi decidiu voltar para Belém.\n\n> Noemi: Voltem para a casa das suas mães. Vocês ainda são jovens.\n\nOrfa voltou. Mas Rute abraçou Noemi e não largou:\n\n> Rute: Aonde você for, eu irei. O seu povo será o meu povo, e o seu Deus será o meu Deus.\n\nE as duas foram juntas para Belém.","pense":"Por que Rute escolheu ficar com Noemi?","cena":"deserto; p:noemi ce; p:rute cd"},{"ordem":3,"titulo":"No campo de Boaz","texto":"As duas chegaram a Belém pobres e sem comida. Era tempo de colheita, e Rute foi ao campo recolher as espigas que os trabalhadores deixavam cair.\n\nO dono do campo, Boaz, perguntou quem ela era:\n\n> Boaz: Ouvi falar de tudo o que você fez por Noemi. Fique aqui no meu campo. Ninguém vai incomodar você.\n\nBoaz ainda pediu aos trabalhadores que deixassem cair espigas de propósito, para Rute levar mais para casa.","pense":"Como Boaz acolheu a estrangeira?","cena":"campo; p:rute ce; p:boaz cd"},{"ordem":4,"titulo":"Uma família nova","texto":"Com o tempo, Boaz e Rute se casaram e tiveram um filho chamado Obede. Noemi, que antes estava sozinha e triste, pegou o netinho no colo, cheia de alegria.\n\nE sabe quem nasceu da família de Obede, muitos anos depois? O rei Davi! E, mais tarde, Jesus também veio dessa família.","pense":"O que mudou na vida de Noemi porque Rute ficou?","cena":"casa; p:noemi ce colo; p:rute cd; p:boaz d"},{"ordem":5,"titulo":"E hoje? Ficar junto","texto":"Ficar junto de alguém é um presente. Pode ser sentar perto de um colega novo, esperar o amigo que é mais devagar ou visitar alguém que está doente.\n\nRute e Boaz acolheram quem estava chegando. A gente também pode acolher.","pense":"Quem precisa de você por perto?","cena":"ceu; p:menina ce; p:mulher cd"}],"passos":[],"quiz":[{"ordem":1,"pergunta":"O que Rute disse a Noemi?","certa":"Aonde você for, eu irei","erradas":["Vou embora","Fique sozinha"],"explicacao":"","nivel":"lembra"},{"ordem":2,"pergunta":"Onde Rute foi trabalhar?","certa":"No campo de Boaz","erradas":["No palácio","No templo"],"explicacao":"","nivel":"lembra"},{"ordem":3,"pergunta":"O que Rute nos ensina?","certa":"Ficar perto de quem está sozinho","erradas":["Pensar só em si","Desistir das pessoas"],"explicacao":"","nivel":"lembra"}],"voceSabia":"Rute é um dos poucos livros da Bíblia com nome de mulher, e ela era estrangeira.","canal":"","oracao":"Senhor, me mostra quem está sozinho para eu ficar perto. Amém.","atividadeRapida":"Faça um desenho de duas pessoas de mãos dadas e dê para alguém que você ama.","nova":false,"livrinho":"https://projetoluzdainclusao.com.br/kids/livrinho-b13.pdf"},{"id":"p13","area":"crianca","secao":"planos","titulo":"Gratidão","resumo":"7 dias de leitura sobre gratidão.","faixas":["5a6","7a9","10a12","13a17"],"formato":"jogo","tema":"Temas","duracao":"7 dias","adulto":false,"arte":"estrela","cor":"#FFC83D","video":"","arquivo":"","texto":"Lucas 17:11-19|O que voltou para agradecer\nSalmo 100|Cantem com alegria\n1 Tessalonicenses 5:16-18|Deem graças em tudo\nSalmo 136:1-9|O amor dele dura para sempre\nJoão 6:9-11|Jesus agradece pelos pães\nFilipenses 4:4-7|Alegrem-se sempre\nSalmo 103:1-5|Não se esqueça do bem que ele fez","baseBiblica":"","lembrar":"Como agradecer a Deus em todos os momentos.","versiculo":"","versiculoRef":"","perguntas":[],"paraAdulto":"","jogo":"plano","jogoRef":"","destaque":false,"ordem":13,"partes":[],"passos":[],"quiz":[],"voceSabia":"","canal":"","oracao":"","atividadeRapida":"","nova":true,"livrinho":""},{"id":"b14","area":"crianca","secao":"historias","titulo":"Daniel na cova dos leões","resumo":"Uma lei injusta, uma janela aberta e leões de boca fechada.","faixas":["5a6","7a9","10a12","13a17"],"formato":"historia","tema":"Coragem e fé","duracao":"8 min","adulto":false,"arte":"leao","cor":"#FFC83D","video":"","arquivo":"","texto":"","baseBiblica":"Daniel 6","lembrar":"Ser fiel a Deus vale a pena, mesmo quando é difícil.","versiculo":"","versiculoRef":"","perguntas":["Por que Daniel foi jogado na cova?","O que Deus fez com os leões?","Quando é difícil fazer o que é certo?"],"paraAdulto":"","jogo":"","jogoRef":"","destaque":false,"ordem":14,"partes":[{"ordem":1,"titulo":"O melhor ajudante do rei","texto":"Daniel morava na Babilônia e trabalhava para o rei Dario. Ele era tão honesto e trabalhador que o rei queria colocá-lo como chefe de todo o reino.\n\nMas outros chefes ficaram com inveja. Procuraram algum erro de Daniel e não acharam nenhum.\n\n> Chefe: O único jeito de pegar Daniel é pela fé dele em Deus.","pense":"Por que os chefes tinham inveja de Daniel?","cena":"palacio; p:daniel ce; p:homem cd; p:homem d"},{"ordem":2,"titulo":"A lei armadilha","texto":"Os chefes convenceram o rei a fazer uma lei: durante trinta dias, ninguém podia orar a nenhum deus, só ao rei. Quem desobedecesse seria jogado na cova dos leões.\n\nO rei assinou, sem perceber a maldade. E a lei não podia mais ser mudada.","pense":"O que você faria se uma regra pedisse algo errado?","cena":"palacio; p:rei cd sentado; p:homem ce; p:homem e"},{"ordem":3,"titulo":"A janela aberta","texto":"Daniel ficou sabendo da lei. Mesmo assim, foi para casa, abriu a janela e orou a Deus, como fazia três vezes por dia.\n\nOs inimigos viram e correram contar ao rei. Dario ficou muito triste, porque gostava de Daniel. Mas teve que mandar jogar Daniel na cova dos leões.\n\n> Rei Dario: Que o seu Deus, a quem você serve sempre, livre você!","pense":"De onde vinha a coragem de Daniel?","cena":"casa; p:daniel ce sentado"},{"ordem":4,"titulo":"De manhã cedinho","texto":"O rei não conseguiu dormir a noite inteira. Logo cedo, correu até a cova:\n\n> Rei Dario: Daniel, o seu Deus conseguiu livrar você?\n> Daniel: Meu Deus enviou o seu anjo e fechou a boca dos leões. Eles não me fizeram mal nenhum!\n\nDaniel saiu da cova sem um arranhão. E o rei escreveu a todo o reino dizendo que o Deus de Daniel é o Deus vivo.","pense":"Como Deus cuidou de Daniel?","cena":"cova; luz c .7; p:daniel c; leao e dorme; leao d"},{"ordem":5,"titulo":"E hoje? Coragem para o certo","texto":"Às vezes, fazer o certo dá medo: defender um colega de uma piada, contar a verdade, não entrar numa brincadeira maldosa.\n\nDaniel sabia que Deus estava com ele. Você também pode contar com Deus para ter coragem.","pense":"Em que situação você precisa de coragem?","cena":"ceu; p:menino ce alegre; p:menina cd"}],"passos":[],"quiz":[{"ordem":1,"pergunta":"O que Daniel fazia três vezes por dia?","certa":"Orava","erradas":["Dormia","Cantava"],"explicacao":"","nivel":"lembra"},{"ordem":2,"pergunta":"Para onde Daniel foi jogado?","certa":"Para a cova dos leões","erradas":["Para o mar","Para a prisão"],"explicacao":"","nivel":"lembra"},{"ordem":3,"pergunta":"O que Deus fez com os leões?","certa":"Fechou a boca deles","erradas":["Fez eles fugirem","Nada"],"explicacao":"","nivel":"lembra"}],"voceSabia":"Daniel orava três vezes por dia, com a janela aberta na direção de Jerusalém.","canal":"","oracao":"Deus, me dá coragem para fazer o que é certo, como Daniel. Amém.","atividadeRapida":"Ruja como um leão bem forte... e agora feche a boca e fique em silêncio, como os leões de Daniel!","nova":false,"livrinho":"https://projetoluzdainclusao.com.br/kids/livrinho-b14.pdf"},{"id":"p14","area":"crianca","secao":"planos","titulo":"Oração","resumo":"7 dias de leitura sobre oração.","faixas":["5a6","7a9","10a12","13a17"],"formato":"jogo","tema":"Temas","duracao":"7 dias","adulto":false,"arte":"luz","cor":"#3E64C8","video":"","arquivo":"","texto":"Mateus 6:5-13|Jesus ensina a orar\n1 Samuel 3:1-10|Fala, Senhor\nDaniel 6:10|A janela aberta\nLucas 11:5-10|Peçam e receberão\nJonas 2:1-10|A oração dentro do peixe\nFilipenses 4:6-7|Não fiquem ansiosos\nMarcos 1:35|Jesus ora de madrugada","baseBiblica":"","lembrar":"Como conversar com Deus, com exemplos de quem orou na Bíblia.","versiculo":"","versiculoRef":"","perguntas":[],"paraAdulto":"","jogo":"plano","jogoRef":"","destaque":false,"ordem":14,"partes":[],"passos":[],"quiz":[],"voceSabia":"","canal":"","oracao":"","atividadeRapida":"","nova":true,"livrinho":""},{"id":"b15","area":"crianca","secao":"historias","titulo":"Jesus acalma a tempestade","resumo":"Vento forte, ondas enormes e Jesus dormindo no barco.","faixas":["2a4","5a6","7a9","10a12"],"formato":"historia","tema":"Medo e confiança","duracao":"6 min","adulto":false,"arte":"barco","cor":"#2448B8","video":"","arquivo":"","texto":"","baseBiblica":"Marcos 4:35-41","lembrar":"Quando eu tenho medo, posso chamar Jesus. Ele está comigo no barco.","versiculo":"","versiculoRef":"","perguntas":["Onde Jesus estava durante a tempestade?","O que Jesus disse ao vento?","Do que você tem medo?"],"paraAdulto":"Uma boa história para conversar sobre medo e sobrecarga. Crianças com ansiedade ou sensibilidade a barulho podem gostar de imitar o \"silêncio, acalme-se\" de Jesus como um jeito de respirar e se acalmar.","jogo":"","jogoRef":"","destaque":false,"ordem":15,"partes":[{"ordem":1,"titulo":"Vamos para o outro lado","texto":"Era fim de tarde. Jesus tinha passado o dia inteiro ensinando muita gente. Então disse aos discípulos:\n\n> Jesus: Vamos para o outro lado do lago.\n\nEles entraram no barco. Jesus estava tão cansado que deitou na parte de trás, num travesseiro, e dormiu.","pense":"Por que Jesus estava tão cansado?","cena":"mar; barco c"},{"ordem":2,"titulo":"A tempestade","texto":"De repente, começou um vento muito forte. As ondas ficaram enormes e começaram a jogar água para dentro do barco.\n\nAlguns discípulos eram pescadores e conheciam o lago, mas nunca tinham visto nada igual.\n\nE Jesus continuava dormindo!","pense":"Como você imagina o barulho daquela tempestade?","cena":"tempestade; barco c; p:jesus c dorme .6"},{"ordem":3,"titulo":"Mestre, acorde!","texto":"Os discípulos ficaram apavorados e foram acordar Jesus:\n\n> Discípulos: Mestre, acorde! O senhor não se importa que vamos afundar?\n\nJesus acordou e se levantou.","pense":"O que você faz quando sente muito medo?","cena":"tempestade; barco c; p:discipulo c .6"},{"ordem":4,"titulo":"Silêncio! Acalme-se!","texto":"Jesus falou com o vento e com as ondas:\n\n> Jesus: Silêncio! Acalme-se!\n\nNa mesma hora, o vento parou. O lago ficou calminho, como um espelho.\n\n> Jesus: Por que vocês estavam com tanto medo? Ainda não confiam em mim?\n> Discípulos: Quem é este, que até o vento e o mar obedecem?","pense":"Como os discípulos se sentiram depois?","cena":"mar; barco c; p:jesus c alegre .6"},{"ordem":5,"titulo":"E hoje? Tempestade por dentro","texto":"Tem dias em que a gente sente uma tempestade por dentro: muito barulho, muita gente, muita coisa ao mesmo tempo. Isso acontece com todo mundo.\n\nVocê pode respirar fundo, contar até cinco, pedir uma pausa ou ir para um cantinho calmo.\n\n> Criança: Preciso de uma pausa.\n> Adulto: Tudo bem. Eu fico aqui com você.","pense":"O que ajuda você a se acalmar?","cena":"ceu; p:menino ce; p:crianca cd"}],"passos":[],"quiz":[{"ordem":1
