      '<p class="palavra-forca" aria-label="Palavra">' + mostra + '</p><div class="teclado">' + 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l => '<button type="button" data-l="' + l + '"' + (certas.has(l) || erradas.has(l) ? ' disabled class="' + (certas.has(l) ? 'ok' : 'nao') + '"' : '') + '>' + l + '</button>').join('') + '</div></div>';
    box.querySelectorAll('[data-l]').forEach(b => b.addEventListener('click', () => { const l = b.dataset.l; (palavra.indexOf(l) !== -1 ? certas : erradas).add(l); desenhar(); }));

};

K.jogos['quebra-cabeca'] = function quebra(box, c) {
  const cenas = String(c.texto || '').split('\n').map(t => t.trim()).filter(Boolean);

  const corpo = svg.replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '');
  const N = 3, w = 400 / N, h = 240 / N;
  let ordem; do { ordem = embaralhar([...Array(N * N).keys()]); } while (ordem.every((v, i) => v === i));
  let sel = null, jogadas = 0;
  const peca = (v) => '<svg viewBox="' + (v % N) * w + ' ' + Math.floor(v / N) * h + ' ' + w + ' ' + h + '" preserveAspectRatio="none">' + corpo + '</svg>';
  function desenhar() {
    box.innerHTML = '<div class="jogo-box"><div class="jogo-topo"><span class="placar">Jogadas: ' + jogadas + '</span><button class="link" style="margin:0;min-height:auto" type="button" data-novo>Outra cena</button></div><div class="qc" style="grid-template-columns:repeat(' + N + ',1fr)">' +
      ordem.map((v, i) => '<button type="button" class="qc-p' + (sel === i ? ' sel' : '') + (v === i ? ' certo' : '') + '" data-i="' + i + '" aria-label="Peça ' + (i + 1) + '">' + peca(v) + '</button>').join('') +
      '</div><details class="qc-ver"><summary>Ver a imagem completa</summary>' + svg + '</details></div>';
    box.querySelector('[data-novo]').addEventListener('click', () => quebra(box, c));
    box.querySelectorAll('.qc-p').forEach(b => b.addEventListener('click', () => {
      const i = +b.dataset.i;
      if (sel === null) { sel = i; return desenhar(); }
      if (sel !== i) { [ordem[sel], ordem[i]] = [ordem[i], ordem[sel]]; jogadas++; }
      sel = null;
      if (ordem.every((v, k) => v === k)) { const pts = Math.max(1, 30 - jogadas); const r = recorde(c.id, pts); return fim(box, 'Cena montada!', 'Você usou ' + jogadas + ' jogadas. ' + (r.novo ? 'Novo recorde!' : ''), () => quebra(box, c), c.id); }
      desenhar();
    }));
  }
  desenhar();
};

K.jogos.plano = function plano(box, c) {

    .map(l => ({ ref: l[0].slice(0, 60), tit: (l[1] || '').slice(0, 120), perg: (l[2] || '').slice(0, 200), certa: (l[3] || '').slice(0, 120), erradas: [l[4], l[5]].filter(Boolean).map(x => x.slice(0, 120)) }));

  let aberto = null;
  const proximo = () => { for (let i = 0; i < dias.length; i++) if (feitos.indexOf(i) === -1) return i; return -1; };

K.jogos.trilha = function trilha(box, c) {
  const chave = 'lik_trilha_' + c.id;
  let est; try { est = JSON.parse(K.ler(chave) || '{}') || {}; } catch (e) { est = {}; }
  const porNivel = n => (c.quiz || []).filter(q => q.nivel === n);
  function mapa() {
    const sr = K.semRelogio();
    box.innerHTML = '<div class="jogo-box"><p style="font-weight:700">Acerte pelo menos 7 de 10 para liberar o próximo nível.</p>' +
      '<button type="button" class="relogio-op" role="switch" aria-checked="' + sr + '" data-relogio' + (K.calmo() ? ' disabled' : '') + '><span class="relogio-op__ch" aria-hidden="true"></span><span><b>Jogar sem relógio</b><small>' + (K.calmo() ? 'Ligado pelo modo calmo' : 'Sem tempo e sem vidas, no seu ritmo') + '</small></span></button><div class="trilha-niv">' + NIVEIS.map((n, k) => {
      const liberado = k === 0 || (est[NIVEIS[k - 1][0]] || 0) >= 7, pts = est[n[0]] || 0;
      const estrelas = pts >= 10 ? 3 : pts >= 8 ? 2 : pts >= 7 ? 1 : 0;
      return '<button type="button" class="niv" data-n="' + k + '"' + (liberado ? '' : ' disabled') + '><span class="niv__n" style="background:' + n[2] + '">' + (liberado ? k + 1 : '🔒') + '</span><span><b>' + n[1] + '</b><small>' + (liberado ? porNivel(n[0]).length + ' perguntas' + (n[3] && !sr ? ', ' + n[3] + ' s cada e 3 vidas' : '') : 'Passe o nível ' + NIVEIS[k - 1][1]) + '</small></span><span class="niv__e" aria-label="' + estrelas + ' estrelas">' + '★'.repeat(estrelas) + '☆'.repeat(3 - estrelas) + '</span></button>';
    }).join('') + '</div></div>';
    box.querySelectorAll('[data-n]').forEach(b => b.addEventListener('click', () => jogar(+b.dataset.n)));
    const rl = box.querySelector('[data-relogio]'); if (rl) rl.addEventListener('click', () => { K.trocarRelogio(!K.semRelogio()); mapa(); });
  }
  function jogar(k) {
    const [id, nome, corN, seg0] = NIVEIS[k];
    const seg = K.semRelogio() ? 0 : seg0;
    const qs = embaralhar(porNivel(id)).slice(0, 10);
    if (!qs.length) { box.innerHTML = '<div class="vazio">Ainda não há perguntas neste nível.</div>'; return; }
    let i = 0, acertos = 0, vidas = seg ? 3 : 0, relogio = null;
    function mostrar() {
      const q = qs[i], ops = embaralhar([q.certa].concat(q.erradas));
      box.innerHTML = '<div class="jogo-box"><div class="jogo-topo"><span class="placar" style="background:' + corN + ';color:#fff">' + nome + ': ' + (i + 1) + ' de ' + qs.length + '</span><span>' + (seg ? '❤️'.repeat(vidas) + '🤍'.repeat(3 - vidas) : 'Acertos: ' + acertos) + '</span></div>' +
        '<div class="barra"><i style="width:' + Math.round(i / qs.length * 100) + '%"></i></div>' + (seg ? '<p class="tempo" data-t>⏱ ' + seg + ' s</p>' : '') +
        '<p class="quiz-perg" tabindex="-1">' + esc(q.pergunta) + '</p>' + ops.map(o => '<button class="quiz-op" type="button">' + K.picto(o) + esc(o) + '</button>').join('') + '<div data-exp></div></div>';
      box.querySelector('.quiz-perg').focus({ preventScroll: true });
      if (seg) { let t = seg; relogio = setInterval(() => { t--; const el = box.querySelector('[data-t]'); if (el) el.textContent = '⏱ ' + t + ' s'; if (t <= 0) responder(null); }, 1000); }
      box.querySelectorAll('.quiz-op').forEach(b => b.addEventListener('click', () => responder(b)));
      function responder(b) {
        clearInterval(relogio);
        if (box.querySelector('.quiz-op[disabled]')) return;
        const certo = !!b && b.textContent === q.certa;
        if (certo) acertos++; else if (seg) vidas--;
        box.querySelectorAll('.quiz-op').forEach(x => { x.disabled = true; if (x.textContent === q.certa) x.classList.add('certa'); });
        if (b && !certo) b.classList.add('errada');
        const acabou = seg && vidas <= 0;
        const msg = (certo ? 'Isso mesmo! ' : b ? 'Quase! ' : 'O tempo acabou! ') + (q.explicacao || '');
        box.querySelector('[data-exp]').innerHTML = '<p class="msg-jogo">' + esc(msg) + '</p><button class="botao botao--azul" style="margin-top:.8rem;width:100%" type="button">' + (acabou ? 'Ver resultado' : i < qs.length - 1 ? 'Próxima pergunta' : 'Ver resultado') + '</button>';
        K.anunciar(msg);
        box.querySelector('[data-exp] button').addEventListener('click', () => { i++; if (!acabou && i < qs.length) mostrar(); else final(acabou); });
      }
    }
    function final(semVidas) {
      if (acertos > (est[id] || 0)) { est[id] = acertos; K.gravar(chave, JSON.stringify(est)); }
      const passou = acertos >= 7;
      if (passou && k === NIVEIS.length - 1) K.conquistar(c.id);
      box.innerHTML = '<div class="jogo-box fim-jogo"><b class="fim-tit">' + (passou ? 'Nível ' + nome + ' concluído!' : 'Foi muito bom tentar!') + '</b><p>' + acertos + ' de ' + qs.length + ' acertos. ' + (passou ? (k < NIVEIS.length - 1 ? 'O nível ' + NIVEIS[k + 1][1] + ' foi liberado!' : 'Você é mestre da Bíblia!') : (semVidas ? 'As vidas acabaram desta vez. ' : '') + 'Acerte 7 para passar de nível. Se quiser, jogue sem relógio.') + '</p>' +
        '<div class="dupla"><button class="botao botao--linha" type="button" data-a="mapa">Ver níveis</button><button class="botao botao--azul" type="button" data-a="de-novo">Jogar de novo</button></div></div>';
      box.querySelector('[data-a="mapa"]').addEventListener('click', mapa);
      box.querySelector('[data-a="de-novo"]').addEventListener('click', () => jogar(k));
    }
    mostrar();
  }
  mapa();
};

 
K.jogos['quem-sou-eu'] = function quem(box, c) {
  const pers = embaralhar(String(c.texto || '').split('\n').map(l => l.split('|').map(x => x.trim())).filter(l => l.length >= 3));
  if (pers.length < 3) { box.innerHTML = '<div class="vazio">Cadastre os personagens na coluna texto: Nome|dica1|dica2|dica3|dica4.</div>'; return; }
  const rodadas = pers.slice(0, 6), nomes = pers.map(p => p[0]);
  let r = 0, pontos = 0;
  function rodada() {
    const p = rodadas[r], dicas = p.slice(1, 5);
    let vistas = 1;
    const ops = embaralhar([p[0]].concat(embaralhar(nomes.filter(n => n !== p[0])).slice(0, 3)));
    function mostrar() {
      box.innerHTML = '<div class="jogo-box"><div class="jogo-topo"><span class="placar">Personagem ' + (r + 1) + ' de ' + rodadas.length + '</span><span>Pontos: ' + pontos + '</span></div>' +
        '<ol class="dicas">' + dicas.slice(0, vistas).map(d => '<li>' + esc(d) + '</li>').join('') + '</ol>' +
        (vistas < dicas.length ? '<button class="botao botao--linha" style="width:100%;margin:.4rem 0" type="button" data-mais>Mais uma dica</button>' : '') +
        '<p style="font-weight:800;margin-top:.6rem">Quem sou eu?</p>' + ops.map(o => '<button class="quiz-op" type="button">' + K.picto(o) + esc(o) + '</button>').join('') + '<div data-exp></div></div>';
      const m = box.querySelector('[data-mais]'); if (m) m.addEventListener('click', () => { vistas++; mostrar(); });
      box.querySelectorAll('.quiz-op').forEach(b => b.addEventListener('click', () => {
        const certo = b.textContent === p[0];
        const ganho = certo ? 5 - vistas : 0; pontos += ganho;
        box.querySelectorAll('.quiz-op').forEach(x => { x.disabled = true; if (x.textContent === p[0]) x.classList.add('certa'); });
        if (!certo) b.classList.add('errada');
        const mm = box.querySelector('[data-mais]'); if (mm) mm.remove();
        box.querySelector('[data-exp]').innerHTML = '<p class="msg-jogo">' + (certo ? 'Acertou! +' + ganho + ' ponto(s).' : 'Era ' + esc(p[0]) + '!') + '</p><button class="botao botao--azul" style="width:100%;margin-top:.6rem" type="button">' + (r < rodadas.length - 1 ? 'Próximo personagem' : 'Ver resultado') + '</button>';
        box.querySelector('[data-exp] button').addEventListener('click', () => { r++; if (r < rodadas.length) rodada(); else { const rr = recorde(c.id, pontos); fim(box, pontos + ' pontos!', (rr.novo ? 'Novo recorde! ' : 'Seu recorde: ' + rr.melhor + '. ') + 'Quanto menos dicas, mais pontos.', () => quem(box, c), c.id); } });
      }));
    }
    mostrar();
  }
  rodada();
};

 
K.jogos.relampago = function relampago(box, c) {
  const frases = embaralhar(String(c.texto || '').split('\n').map(l => l.split('|').map(x => x.trim())).filter(l => l[0] && /^[VF]$/i.test(l[1] || '')));
  if (frases.length < 5) { box.innerHTML = '<div class="vazio">Cadastre as frases: frase|V ou frase|F.</div>'; return; }
  const livre = K.semRelogio(), TOTAL = Math.min(15, frases.length);
  box.innerHTML = '<div class="jogo-box" style="text-align:center"><p style="font-weight:700">' + (livre ? 'Sem relógio: são ' + TOTAL + ' frases, no seu ritmo.' : 'Você tem 60 segundos. Responda o máximo que conseguir!') + '</p><button class="botao botao--luz" style="margin-top:1rem;width:100%" type="button" data-go>Começar</button></div>';
  box.querySelector('[data-go]').addEventListener('click', () => {
    let t = 60, i = 0, pontos = 0, relogio;
    if (livre) {
      const passo = () => {
        if (i >= TOTAL) return fim(box, pontos + ' de ' + TOTAL + ' certas!', 'Muito bem! Você foi no seu ritmo.', () => relampago(box, c), c.id);
        const f = frases[i];
        box.innerHTML = '<div class="jogo-box"><div class="jogo-topo"><span class="placar">Frase ' + (i + 1) + ' de ' + TOTAL + '</span><span>Certas: ' + pontos + '</span></div><p class="quiz-perg vf-frase">' + esc(f[0]) + '</p>' +
          '<div class="dupla"><button class="botao vf-v" type="button" data-r="V">Verdadeiro</button><button class="botao vf-f" type="button" data-r="F">Falso</button></div><div data-exp></div></div>';
        box.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => {
          const certo = b.dataset.r === f[1].toUpperCase(); if (certo) pontos++;
          box.querySelectorAll('[data-r]').forEach(x => x.disabled = true);
          box.querySelector('[data-exp]').innerHTML = '<p class="msg-jogo">' + (certo ? 'Isso mesmo!' : 'Era ' + (f[1].toUpperCase() === 'V' ? 'verdadeiro' : 'falso') + '.') + '</p><button class="botao botao--azul" style="margin-top:.8rem;width:100%" type="button">' + (i < TOTAL - 1 ? 'Próxima frase' : 'Ver resultado') + '</button>';
          box.querySelector('[data-exp] button').addEventListener('click', () => { i++; passo(); });
        }));
      };
      return passo();
    }
    function mostrar() {
      const f = frases[i % frases.length];
      box.innerHTML = '<div class="jogo-box"><div class="jogo-topo"><span class="placar">⏱ ' + t + ' s</span><span>Pontos: ' + pontos + '</span></div><p class="quiz-perg vf-frase">' + esc(f[0]) + '</p>' +
        '<div class="dupla"><button class="botao vf-v" type="button" data-r="V">Verdadeiro</button><button class="botao vf-f" type="button" data-r="F">Falso</button></div><p class="msg-jogo" data-m></p></div>';
      box.querySelectorAll('[data-r]').forEach(b => b.addEventListener('click', () => {
        const certo = b.dataset.r === f[1].toUpperCase();
        if (certo) pontos++;
        i++; mostrar(); box.querySelector('[data-m]').textContent = certo ? '✓ Certo!' : '✗ Era ' + (f[1].toUpperCase() === 'V' ? 'verdadeiro' : 'falso') + '.';
      }));
    }
    relogio = setInterval(() => { t--; const p = box.querySelector('.placar'); if (p) p.textContent = '⏱ ' + t + ' s'; if (t <= 0) { clearInterval(relogio); const r = recorde(c.id, pontos); fim(box, pontos + ' acertos em 60 segundos!', r.novo ? 'Novo recorde pessoal!' : 'Seu recorde: ' + r.melhor + '.', () => relampago(box, c), c.id); } }, 1000);
    mostrar();
  });
};

 
K.jogos.cifra = function cifra(box, c) {
  const msgs = String(c.texto || '').split('\n').map(l => l.split('|').map(x => x.trim())).filter(l => l[0]);
  if (!msgs.length) { box.innerHTML = '<div class="vazio">Cadastre as mensagens: FRASE|referência.</div>'; return; }
  const m = msgs[Math.floor(Math.random() * msgs.length)];
  const norm = s => s.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  const frase = norm(m[0]).replace(/[^A-Z ]/g, '');
  const SIMB = ['★', '●', '▲', '■', '♥', '◆', '☀', '☁', '✿', '♪', '☂', '⚑', '✚', '☾', '♣', '✦', '⬟', '◐', '✱', '⬢', '☘', '✈', '⌂', '♠', '⚓', '✎'];
  const letras = [...new Set(frase.replace(/ /g, '').split(''))];
  const mapa = {}; embaralhar(SIMB).slice(0, letras.length).forEach((s, k) => mapa[letras[k]] = s);
  const resp = {};
  letras.slice(0, Math.ceil(letras.length / 3)).forEach(l => resp[l] = l);
  function desenhar() {
    const palavras = frase.split(' ');
    box.innerHTML = '<div class="jogo-box"><p style="font-weight:700">Toque num símbolo e escolha a letra. Dica: é um versículo da Bíblia!</p>' +
      '<div class="cifra">' + palavras.map(w => '<span class="cifra__p">' + w.split('').map(l => '<button type="button" class="cifra__l' + (resp[l] === l ? ' ok' : '') + '" data-l="' + l + '"><b>' + (resp[l] || '') + '</b><span>' + mapa[l] + '</span></button>').join('') + '</span>').join('') + '</div>' +
      '<p class="aviso-sutil">Chave parcial: ' + letras.slice(0, Math.ceil(letras.length / 3)).map(l => mapa[l] + ' = ' + l).join(', ') + '</p><div data-teclado></div><p class="msg-jogo" data-m></p></div>';
    box.querySelectorAll('[data-l]').forEach(b => b.addEventListener('click', () => {
      const alvo = b.dataset.l;
      box.querySelector('[data-teclado]').innerHTML = '<div class="teclado">' + 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(x => '<button type="button" data-k="' + x + '">' + x + '</button>').join('') + '</div>';
      box.querySelectorAll('[data-k]').forEach(k => k.addEventListener('click', () => {
        if (k.dataset.k === alvo) { resp[alvo] = alvo; desenhar(); if (letras.every(l => resp[l] === l)) { K.conquistar(c.id); setTimeout(() => fim(box, 'Mensagem decifrada!', '"' + m[0] + '" (' + (m[1] || '') + ')', () => cifra(box, c), c.id), 600); } }
        else { box.querySelector('[data-m]').textContent = 'Não é essa letra. Tente outra!'; }
      }));
    }));
  }
  desenhar();
};

 
K.jogos.sequencia = function sequencia(box, c) {
  const certos = String(c.texto || '').split('\n').map(t => t.trim()).filter(Boolean).slice(0, 12);
  if (certos.length < 3) { box.innerHTML = '<div class="vazio">Cadastre os itens em ordem, um por linha.</div>'; return; }
  let prox = 0, erros = 0;
  const limpo = t => t.replace(/^Dia \d+:\s*/i, '');
  box.innerHTML = '<div class="jogo-box"><p style="font-weight:700">Toque na ordem certa, do primeiro ao último.</p>' + embaralhar(certos).map(t => '<button class="ordem-op" type="button" data-t="' + esc(t) + '"><span></span>' + esc(limpo(t)) + '</button>').join('') + '<p class="msg-jogo" data-m>O que veio primeiro?</p></div>';
  box.querySelectorAll('.ordem-op').forEach(b => b.addEventListener('click', () => {
    if (b.classList.contains('feita')) return;
    if (b.dataset.t === certos[prox]) { b.classList.add('feita'); b.querySelector('span').textContent = ++prox; if (prox === certos.length) { const r = recorde(c.id, Math.max(0, 10 - erros)); setTimeout(() => fim(box, 'Sequência completa!', (erros ? erros + ' erro(s). ' : 'Perfeito! ') + (r.novo ? 'Novo recorde!' : ''), () => sequencia(box, c), c.id), 500); } else box.querySelector('[data-m]').textContent = 'Isso! E depois?'; }
    else { erros++; b.classList.remove('erro'); void b.offsetWidth; b.classList.add('erro'); box.querySelector('[data-m]').textContent = 'Ainda não. Pense no que vem antes.'; }
  }));
};

 
K.jogos.escolher = function escolher(box, c) {
  const itens = embaralhar(String(c.texto || '').split('\n').map(l => l.split('|').map(x => x.trim())).filter(l => l[0]));
  const total = itens.filter(i => i[1] === '1').length;
  if (!total) { box.innerHTML = '<div class="vazio">Cadastre os itens: nome|1 (certo) ou nome|0.</div>'; return; }
  let achados = 0, erros = 0;
  box.innerHTML = '<div class="jogo-box"><p style="font-weight:700">Encontre os ' + total + ' certos!</p><div class="jogo-topo"><span class="placar" data-p>0 de ' + total + '</span><span data-e>Erros: 0</span></div><div class="escolher">' + itens.map((it, k) => '<button type="button" class="esc-op" data-k="' + k + '">' + esc(it[0]) + '</button>').join('') + '</div></div>';
  box.querySelectorAll('[data-k]').forEach(b => b.addEventListener('click', () => {
    if (b.disabled) return; b.disabled = true;
    if (itens[+b.dataset.k][1] === '1') { b.classList.add('certa'); achados++; box.querySelector('[data-p]').textContent = achados + ' de ' + total; if (achados === total) { const r = recorde(c.id, Math.max(0, 10 - erros)); setTimeout(() => fim(box, 'Você encontrou todos!', (erros ? erros + ' erro(s). ' : 'Sem nenhum erro! ') + (r.novo ? 'Novo recorde!' : ''), () => escolher(box, c), c.id), 500); } }
    else { b.classList.add('errada'); erros++; box.querySelector('[data-e]').textContent = 'Erros: ' + erros; }
  }));
};


})();
